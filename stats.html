<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tier List HoK - HoKstats</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
/* 📊 IDENTIDAD GLOBAL UNIFICADA - IGUAL AL INDEX */
body {
  background: #1c1c1f;
  font-family: Arial, sans-serif;
  color: #7b7a8e;
  margin: 0;
  padding: 20px;
  user-select: none;
}

.container {
  max-width: 1100px;
  margin: auto;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo-text {
  font-family: monospace;
  font-size: 22px;
  color: white;
  margin-bottom: 10px;
  margin-left: 4px;
  letter-spacing: 1px;
}

.view-tabs {
  display: flex;
  gap: 6px;
}

.view-tab {
  padding: 6px 12px;
  font-size: 12px;
  background: #31313c;
  border: 1px solid #444452;
  cursor: pointer;
  color: #a0a0b5;
  text-decoration: none;
  white-space: nowrap;
}

.view-tab.active {
  background: #4f6edb;
  color: white;
}

/* 📦 CAJA MAESTRA UNIVERSAL (ESTRUCTURA INMÓVIL) */
.main-box {
  background: #31313c;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid #1c1c1f;
  padding: 0 0 30px 0;
}

/* 🔍 ZONA DE FILTROS (Mismo comportamiento horizontal que el bloque del Index) */
.tabs-container {
  padding: 40px 30px 15px 30px; /* Sincronizado con el padding superior del Index */
  background: #31313c;
}

.tabs-wrapper {
  display: flex;
  gap: 10px;
  width: 100%;
  align-items: center;
}

.tabs {
  display: flex;
  flex: 1 1 auto;
  min-width: 0;
  border: 1px solid #444452;
  border-radius: 4px;
  overflow: hidden;
}

.role-tab {
  flex: 1 1 0;
  min-width: 0;
  text-align: center;
  padding: 8px 10px;
  cursor: pointer;
  border: none;
  border-right: 1px solid #444452;
  background: #31313c;
  font-size: 12px;
  font-weight: 500;
  color: #7b7a8e;
  outline: none;
}

.role-tab:last-child { border-right: none; }
.role-tab.active { color: white; background: #4f6edb; }

.search-box {
  width: 180px;
  flex: 0 0 180px;
}

.search-box input {
  width: 100%;
  padding: 7px 10px;
  border-radius: 4px;
  border: 1px solid #444452;
  background: #282830;
  color: #ccc;
  box-sizing: border-box;
  font-size: 12px;
  outline: none;
}

/* 🎯 ZONA DE CONTENIDO INTERNO (Alineación horizontal perfecta de 30px) */
.content-padding-zone {
  padding: 0 30px;
}

.view-switcher {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.switch-tab {
  padding: 6px 14px;
  font-size: 11px;
  background: #24242b;
  border: 1px solid #444452;
  border-radius: 4px;
  cursor: pointer;
  color: #a0a0b5;
}

.switch-tab.active {
  background: #4f6edb;
  color: white;
  border-color: #4f6edb;
}

.view {
  display: none;
}

.view.active {
  display: block;
}

/* 📊 COMPONENTES DE TABLAS Y GRÁFICOS */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  text-align: left;
}

th {
  background: #24242b;
  color: #7b7a8e;
  padding: 10px;
  font-weight: normal;
  border-bottom: 1px solid #444452;
}

th.sortable {
  cursor: pointer;
}

th.sortable:hover {
  color: white;
  background: #2c2c35;
}

td {
  padding: 8px 10px;
  border-bottom: 1px solid #24242b;
  color: white;
  vertical-align: middle;
}

tr:hover td {
  background: #292933;
}

.hero-cell {
  display: flex;
  align-items: center;
  gap: 8px;
}

.hero-img {
  width: 28px;
  height: 28px;
  border-radius: 4px;
  object-fit: cover;
}

.tier-badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 3px;
  font-weight: bold;
  font-size: 10px;
}

.tier-S { background: #ff4747; color: white; }
.tier-A { background: #ff9f43; color: white; }
.tier-B { background: #00d2d3; color: white; }
.tier-C { background: #54a0ff; color: white; }

/* scrollbar unificado */
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: #1c1c1f; }
::-webkit-scrollbar-thumb { background: #444452; border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: #5a5a6b; }
</style>
</head>
<body>

<div class="container">

  <div class="top-bar">
    <div class="logo-text">HoKstats</div>
    <div class="view-tabs">
      <a href="index.html" class="view-tab">General</a>
      <a href="stats.html" class="view-tab active">Estadísticas</a>
      <a href="counter.html" class="view-tab">Counters</a>
      <a href="planner.html" class="view-tab">Planner</a>
      <a href="draft.html" class="view-tab">Draft</a>
      <a href="acerca.html" class="view-tab">Acerca de</a>
    </div>
  </div>

  <div class="main-box">
    
    <div class="tabs-container">
      <div class="tabs-wrapper">
        <div class="tabs">
          <button class="role-tab active" data-role="all">Todo</button>
          <button class="role-tab" data-role="Choque">Choque</button>
          <button class="role-tab" data-role="Cazador">Cazador</button>
          <button class="role-tab" data-role="Medio">Medio</button>
          <button class="role-tab" data-role="Merodeo">Merodeo</button>
          <button class="role-tab" data-role="Farmeo">Farmeo</button>
        </div>
        <div class="search-box">
          <input type="text" id="searchHero" placeholder="Buscar héroe...">
        </div>
      </div>
    </div>

    <div class="content-padding-zone">
      
      <div class="view-switcher">
        <button class="switch-tab active" data-view="table">Vista Tabla</button>
        <button class="switch-tab" data-view="charts">Gráficos Analíticos</button>
      </div>

      <div id="table" class="view active">
        <table>
          <thead>
            <tr>
              <th>Héroe</th>
              <th class="sortable" data-sort="tier">Tier</th>
              <th class="sortable" data-sort="win">Win Rate</th>
              <th class="sortable" data-sort="pick">Pick Rate</th>
              <th class="sortable" data-sort="ban">Ban Rate</th>
            </tr>
          </thead>
          <tbody id="table-body">
            </tbody>
        </table>
      </div>

      <div id="charts" class="view">
        <div style="position: relative; width: 100%; height: 450px;">
          <canvas id="scatterChart"></canvas>
        </div>
      </div>

    </div>

  </div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTshmS9B7Xun6700K7N8O-nN-IepC05VbZ67-fJ85w-A6H2Gj8_k1_b9_7X-S77w6_fN4U5N1N2N3N4/pub?output=csv';

let allData = [];
let currentRoleFilter = 'all';
let currentSortKey = 'tier'; 
let currentSortOrder = 'asc'; 

let chartInstance = null;
let chartCreated = false;

const imagePointsPlugin = {
  id: 'imagePoints',
  afterDraw: (chart) => {
    const {ctx} = chart;
    chart.data.datasets.forEach((dataset, datasetIndex) => {
      const meta = chart.getDatasetMeta(datasetIndex);
      meta.data.forEach((point, index) => {
        const rawData = dataset.data[index];
        const img = rawData.imgInstance;
        if (img && img.complete) {
          const size = 24; 
          ctx.save();
          ctx.beginPath();
          ctx.arc(point.x, point.y, size/2, 0, Math.PI * 2);
          ctx.clip();
          ctx.drawImage(img, point.x - size/2, point.y - size/2, size, size);
          ctx.restore();
          
          ctx.save();
          ctx.strokeStyle = '#444452';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(point.x, point.y, size/2, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      });
    });
  }
};

Chart.register(imagePointsPlugin);

document.addEventListener("DOMContentLoaded", () => {
  Papa.parse(CSV_URL, {
    download: true,
    header: true,
    dynamicTyping: true,
    complete: function(results) {
      allData = results.data.filter(row => row.nombre);
      allData.forEach(hero => {
        if(hero.roles) {
          hero.roles = hero.roles.split(',').map(r => r.trim());
        } else {
          hero.roles = [];
        }
      });
      renderTable();
    }
  });
});

function renderTable() {
  const tbody = document.getElementById("table-body");
  tbody.innerHTML = "";

  let filtered = allData.filter(hero => {
    if (currentRoleFilter !== 'all' && !hero.roles.includes(currentRoleFilter)) return false;
    const q = document.getElementById("searchHero").value.toLowerCase();
    if (q && !hero.nombre.toLowerCase().includes(q)) return false;
    return true;
  });

  const tierOrder = { 'S': 1, 'A': 2, 'B': 3, 'C': 4 };
  filtered.sort((a, b) => {
    let valA = a[currentSortKey];
    let valB = b[currentSortKey];

    if (currentSortKey === 'tier') {
      valA = tierOrder[valA] || 99;
      valB = tierOrder[valB] || 99;
    }

    if (valA < valB) return currentSortOrder === 'asc' ? -1 : 1;
    if (valA > valB) return currentSortOrder === 'asc' ? 1 : -1;
    return 0;
  });

  filtered.forEach(hero => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>
        <div class="hero-cell">
          <img src="${hero.imagen}" class="hero-img" onerror="this.src='https://via.placeholder.com/28'">
          <span>${hero.nombre}</span>
        </div>
      </td>
      <td><span class="tier-badge tier-${hero.tier}">${hero.tier}</span></td>
      <td>${hero.win}%</td>
      <td>${hero.pick}%</td>
      <td>${hero.ban}%</td>
    `;
    tbody.appendChild(tr);
  });
}

document.querySelectorAll('.role-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentRoleFilter = tab.dataset.role;
    renderTable();
    if (chartCreated) createChart();
  });
});

document.getElementById("searchHero").addEventListener("input", () => {
  renderTable();
  if (chartCreated) createChart();
});

document.querySelectorAll('th.sortable').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (currentSortKey === key) {
      currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
    } else {
      currentSortKey = key;
      currentSortOrder = (key === 'tier') ? 'asc' : 'desc';
    }
    renderTable();
  });
});

document.querySelectorAll(".switch-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".switch-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");

    const view = tab.dataset.view;
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById(view).classList.add("active");

    if (view === "charts" && !chartCreated && allData.length > 0) {
      createChart();
      chartCreated = true;
    }
  });
});

function createChart() {
  const ctx = document.getElementById("scatterChart");

  let filtered = allData.filter(hero => {
    if (currentRoleFilter !== 'all' && !hero.roles.includes(currentRoleFilter)) return false;
    const q = document.getElementById("searchHero").value.toLowerCase();
    if (q && !hero.nombre.toLowerCase().includes(q)) return false;
    return true;
  });

  const data = filtered.map(hero => {
    const img = new Image();
    img.src = hero.imagen;

    return {
      x: hero.pick + hero.ban,
      y: hero.win,
      imgInstance: img,
      name: hero.nombre
    };
  });

  if (chartInstance) {
    chartInstance.destroy();
  }

  chartInstance = new Chart(ctx, {
    type: 'scatter',
    data: {
      datasets: [{
        label: 'Heroes',
        data: data,
        pointRadius: 12,
        pointHitRadius: 15,
        backgroundColor: 'transparent',
        borderColor: 'transparent'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(context) {
              const d = data[context.dataIndex];
              return `${d.name} | Win: ${d.y}% | Presencia: ${d.x.toFixed(1)}%`;
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: '#24242b' },
          ticks: { color: '#7b7a8e' },
          title: { display: true, text: 'Presencia (Pick + Ban %)', color: '#a0a0b5' }
        },
        y: {
          grid: { color: '#24242b' },
          ticks: { color: '#7b7a8e' },
          title: { display: true, text: 'Win Rate (%)', color: '#a0a0b5' }
        }
      }
    }
  });
}
</script>
</body>
</html>
