<!DOCTYPE html>
<html lang="es" style="scrollbar-gutter: stable;">
<head>
<meta charset="UTF-8">
<title>Draft Simulator - HoKstats</title>
<style>
/* 📊 IDENTIDAD GLOBAL UNIFICADA Y CONTROL DE LAYOUT SHIFT (CALCO DE COUNTERS) */
* {
  box-sizing: border-box;
}

body {
  background: #1c1c1f;
  font-family: Arial, sans-serif;
  color: #7b7a8e;
  margin: 0;
  padding: 24px 0; /* Relleno superior/inferior idéntico */
  user-select: none;
}

/* MARCO MAESTRO: Bloquea los límites horizontales milimétricamente en todo el sitio */
.container {
  width: 100%;
  max-width: 1160px; /* 1100px útiles + 60px de padding total acumulado */
  margin: 0 auto;
  padding: 0 30px;
}

/* BARRA SUPERIOR ESTÁTICA */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: flex-end; /* Alineación perfecta al piso de la pestaña */
  margin-bottom: 20px;
  padding: 0 4px;
}

.logo-text {
  font-family: monospace;
  font-size: 22px;
  color: white;
  margin: 0;
  letter-spacing: 1px;
  line-height: 1;
}

.view-tabs {
  display: flex;
  gap: 6px;
}

.view-tab {
  padding: 6px 12px;
  font-size: 12px;
  background: #31313c;
  border: 1px solid #444452;
  cursor: pointer;
  color: #a0a0b5;
  text-decoration: none;
  white-space: nowrap;
  line-height: 1.2;
}

.view-tab.active {
  background: #4f6edb;
  color: white;
  border-color: #4f6edb;
}

/* 📦 CAJA MAESTRA UNIVERSAL (RÉPLICA EXACTA EN TODAS LAS PÁGINAS) */
.main-box {
  background: #31313c;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid #444452; /* Borde unificado de alta visibilidad */
  width: 100%;
}

/* CONTENEDOR INTERNO PARA DAR CONTINUIDAD AL ANCHO DE CONTENIDO */
.content-padding-zone {
  padding: 40px 30px 40px 30px; /* Relleno lateral idéntico de 30px */
}

/* 🎮 INTERFAZ DE DRAFT ENCAPSULADA (ESTILOS PROPIOS DEL SIMULADOR) */
.draft-dashboard {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 25px;
}

/* BANDOS: AZUL (IZQUIERDA) Y ROJO (DERECHA) */
.team-side {
  width: 240px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex-shrink: 0;
}

.team-header-panel {
  padding: 10px 14px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border: 1px solid #444452;
}

.team-side.blue-side .team-header-panel {
  background: rgba(79, 110, 219, 0.15);
  color: #5b84ff;
  border-color: rgba(79, 110, 219, 0.4);
}

.team-side.red-side .team-header-panel {
  background: rgba(220, 38, 38, 0.15);
  color: #f87171;
  border-color: rgba(220, 38, 38, 0.4);
  text-align: right;
}

/* RANURAS DE SELECCIÓN (PICKS) */
.pick-slots-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.pick-slot {
  background: #24242b;
  border: 1px solid #444452;
  border-radius: 6px;
  height: 54px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 12px;
  position: relative;
  overflow: hidden;
}

.blue-side .pick-slot { flex-direction: row; }
.red-side .pick-slot { flex-direction: row-reverse; text-align: right; }

.pick-slot.active-turn {
  border-color: #4f6edb;
  box-shadow: 0 0 8px rgba(79, 110, 219, 0.4);
}
.red-side .pick-slot.active-turn {
  border-color: #dc2626;
  box-shadow: 0 0 8px rgba(220, 38, 38, 0.4);
}

.slot-avatar {
  width: 36px;
  height: 36px;
  border-radius: 4px;
  background: #1c1c1f;
  border: 1px solid #31313c;
  object-fit: cover;
  flex-shrink: 0;
}

.slot-info {
  min-width: 0;
  flex: 1;
}

.slot-role-label {
  font-size: 10px;
  color: #555566;
  text-transform: uppercase;
  font-weight: bold;
}

.slot-hero-name {
  font-size: 13px;
  font-weight: bold;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}

.slot-hero-name.empty {
  color: #444452;
}

/* BLOQUE DE BANEOS INFERIOR POR EQUIPO */
.ban-slots-row {
  display: flex;
  gap: 6px;
  margin-top: 4px;
}

.red-side .ban-slots-row { justify-content: flex-end; }

.ban-slot {
  width: 34px;
  height: 34px;
  background: #24242b;
  border: 1px solid #444452;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

.ban-slot.active-turn { border-color: #eab308; box-shadow: 0 0 6px rgba(234, 179, 8, 0.4); }

.ban-avatar {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(1) brightness(0.6);
}

.ban-slot::after {
  content: '';
  position: absolute;
  width: 140%;
  height: 2px;
  background: #dc2626;
  transform: rotate(45deg);
  opacity: 0.6;
  pointer-events: none;
}

/* 🎛️ PANEL CENTRAL: PANEL DE ESTADO Y FILTROS */
.center-board {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* MARCADOR DE ESTADO DEL DRAFT */
.status-central-banner {
  background: #24242b;
  border: 1px solid #444452;
  border-radius: 6px;
  padding: 12px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 75px;
}

.status-phase-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: bold;
  color: #eab308;
}

.status-instruction-text {
  font-size: 15px;
  font-weight: bold;
  color: #fff;
  margin-top: 4px;
}

/* BARRA DE FILTROS INTERNA */
.drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.tabs {
  display: flex;
  border: 1px solid #444452;
  border-radius: 4px;
  overflow: hidden;
  flex: 1;
}

.tab {
  flex: 1;
  text-align: center;
  padding: 8px 10px;
  cursor: pointer;
  background: #31313c;
  font-size: 11px;
  color: #7b7a8e;
  font-weight: bold;
  text-transform: uppercase;
  border-right: 1px solid #444452;
  border-none: none;
  outline: none;
  transition: all 0.2s ease;
}

.tab:last-child { border-right: none; }
.tab:hover { color: #fff; background: #3a3a46; }
.tab.active {
  color: white;
  background: #4f6edb;
}

.search-box {
  width: 160px;
  flex-shrink: 0;
}

.search-box input {
  width: 100%;
  padding: 7px 10px;
  border-radius: 4px;
  border: 1px solid #444452;
  background: #282830;
  color: #ccc;
  box-sizing: border-box;
  font-size: 12px;
  outline: none;
}

/* REJILLA SELECTORA DE HÉROES */
.heroes-selection-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
  gap: 8px;
  background: #24242b;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #1c1c1f;
  max-height: 335px;
  overflow-y: auto;
}

.hero-selection-item {
  aspect-ratio: 1;
  border-radius: 6px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  border: 1px solid #444452;
  transition: transform 0.1s ease, border-color 0.2s;
}

.hero-selection-item:hover:not(.disabled-hero) {
  transform: scale(1.05);
  border-color: #4f6edb;
}

.hero-selection-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.hero-selection-item.disabled-hero {
  cursor: not-allowed;
  opacity: 0.25;
  filter: grayscale(1);
  border-color: #1c1c1f;
}

/* PIE DE ACCIONES GENERALES */
.draft-actions-footer {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 5px;
}

.btn-action {
  background: #31313c;
  border: 1px solid #444452;
  color: #ccc;
  padding: 8px 16px;
  font-size: 12px;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
}
.btn-action:hover:not(:disabled) { background: #3a3a46; color: white; }
.btn-action:disabled { opacity: 0.3; cursor: not-allowed; }

/* 📊 REJILLA DE RECOMENDACIONES EN TIEMPO REAL */
.recommendations-box {
  margin-top: 5px;
}

.recommendations-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.rec-column {
  background: #24242b;
  border: 1px solid #444452;
  border-radius: 6px;
  padding: 12px;
}

.rec-column-header {
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid #31313c;
}

.rec-column.blue-rec .rec-column-header { color: #5b84ff; }
.rec-column.red-rec .rec-column-header { color: #f87171; }

.rec-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.mini-rec-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #1c1c1f;
  border: 1px solid #31313c;
  border-radius: 4px;
  padding: 6px 10px;
}

.mini-rec-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.mini-rec-avatar {
  width: 28px;
  height: 28px;
  border-radius: 4px;
  object-fit: cover;
}

.mini-rec-name {
  color: white;
  font-weight: bold;
  font-size: 12px;
}

.mini-rec-value {
  font-size: 11px;
  font-weight: bold;
}

/* SCROLLBAR NATIVA MODO OSCURO (CALCO IDÉNTICO) */
::-webkit-scrollbar {
  width: 10px;
}
::-webkit-scrollbar-track {
  background: #1c1c1f;
}
::-webkit-scrollbar-thumb {
  background: #444452;
  border-radius: 6px;
}
::-webkit-scrollbar-thumb:hover {
  background: #5a5a6b;
}
</style>
</head>
<body>

<div class="container">

  <div class="top-bar">
    <div class="logo-text">HoKstats</div>
    <div class="view-tabs">
      <a href="index.html" class="view-tab">General</a>
      <a href="stats.html" class="view-tab">Estadísticas</a>
      <a href="counter.html" class="view-tab">Counters</a>
      <a href="planner.html" class="view-tab">Planner</a>
      <a href="draft.html" class="view-tab active">Draft</a>
      <a href="acerca.html" class="view-tab">Acerca de</a>
    </div>
  </div>

  <div class="main-box">
    <div class="content-padding-zone">

      <div class="draft-dashboard">
        
        <div class="team-side blue-side">
          <div class="team-header-panel">Equipo Azul</div>
          <div class="pick-slots-list" id="blue-picks-container">
            </div>
          <div class="ban-slots-row" id="blue-bans-container">
            </div>
        </div>

        <div class="center-board">
          <div class="status-central-banner">
            <div class="status-phase-title" id="phase-label">Fase de Preparación</div>
            <div class="status-instruction-text" id="instruction-label">Cargando simulador...</div>
          </div>

          <div class="drawer-header">
            <div class="tabs">
              <button class="tab active" data-role="all">Todo</button>
              <button class="tab" data-role="Choque">Choque</button>
              <button class="tab" data-role="Cazador">Cazador</button>
              <button class="tab" data-role="Medio">Medio</button>
              <button class="tab" data-role="Merodeo">Merodeo</button>
              <button class="tab" data-role="Farmeo">Farmeo</button>
            </div>
            <div class="search-box">
              <input type="text" id="heroSearch" placeholder="Buscar héroe...">
            </div>
          </div>

          <div class="heroes-selection-grid" id="catalogGridZone">
            </div>

          <div class="draft-actions-footer">
            <button class="btn-action" id="btn-undo" onclick="deshacerUltimoPaso()">↩️ Deshacer</button>
            <button class="btn-action" id="btn-reset" onclick="reiniciarDraft()" style="border-color:#ef4444; color:#f87171;">🔄 Reiniciar Completo</button>
          </div>
        </div>

        <div class="team-side red-side">
          <div class="team-header-panel">Equipo Rojo</div>
          <div class="pick-slots-list" id="red-picks-container">
            </div>
          <div class="ban-slots-row" id="red-bans-container">
            </div>
        </div>

      </div>

      <div class="recommendations-box">
        <div class="recommendations-grid">
          <div class="rec-column blue-rec">
            <div class="rec-column-header">💡 Sugerencias sugeridas - Equipo Azul</div>
            <div class="rec-list" id="blue-rec-list">
              <div style="font-size:11px; color:#555566; text-align:center; padding:10px;">Inicia el draft para calcular sinergias</div>
            </div>
          </div>
          <div class="rec-column red-rec">
            <div class="rec-column-header">💡 Sugerencias sugeridas - Equipo Rojo</div>
            <div class="rec-list" id="red-rec-list">
              <div style="font-size:11px; color:#555566; text-align:center; padding:10px;">Inicia el draft para calcular counters</div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTO4rMY_drrjKMx3KTdjAaSrH6GenxyZ7YzLPT7oiZ_pNYm6EKG-yJPfmbRcZgYGGi2gERA1Gciw-Fy/pub?gid=538223640&single=true&output=csv";

let heroesData = [];
let currentRoleFilter = 'all';
let currentSearchQuery = '';

// Orden oficial competitivo global de fases de Draft (6 Bans -> 6 Picks -> 4 Bans -> 4 Picks)
const DRAFT_FLOW = [
  { type: 'ban', team: 'blue', slot: 0, label: 'Ban 1 Azul' },
  { type: 'ban', team: 'red',  slot: 0, label: 'Ban 1 Rojo' },
  { type: 'ban', team: 'blue', slot: 1, label: 'Ban 2 Azul' },
  { type: 'ban', team: 'red',  slot: 1, label: 'Ban 2 Rojo' },
  { type: 'ban', team: 'blue', slot: 2, label: 'Ban 3 Azul' },
  { type: 'ban', team: 'red',  slot: 2, label: 'Ban 3 Rojo' },

  { type: 'pick', team: 'blue', slot: 0, label: 'Pick 1 Azul' },
  { type: 'pick', team: 'red',  slot: 0, label: 'Pick 1 Rojo' },
  { type: 'pick', team: 'red',  slot: 1, label: 'Pick 2 Rojo' },
  { type: 'pick', team: 'blue', slot: 1, label: 'Pick 2 Azul' },
  { type: 'pick', team: 'blue', slot: 2, label: 'Pick 3 Azul' },
  { type: 'pick', team: 'red',  slot: 2, label: 'Pick 3 Rojo' },

  { type: 'ban', team: 'red',  slot: 3, label: 'Ban 4 Rojo' },
  { type: 'ban', team: 'blue', slot: 3, label: 'Ban 4 Azul' },
  { type: 'ban', team: 'red',  slot: 4, label: 'Ban 5 Rojo' },
  { type: 'ban', team: 'blue', slot: 4, label: 'Ban 5 Azul' },

  { type: 'pick', team: 'red',  slot: 3, label: 'Pick 4 Rojo' },
  { type: 'pick', team: 'blue', slot: 3, label: 'Pick 4 Azul' },
  { type: 'pick', team: 'blue', slot: 4, label: 'Pick 5 Azul' },
  { type: 'pick', team: 'red',  slot: 4, label: 'Pick 5 Rojo' }
];

let currentStepIndex = 0;

let state = {
  blue: { picks: [null, null, null, null, null], bans: [null, null, null, null, null] },
  red:  { picks: [null, null, null, null, null], bans: [null, null, null, null, null] }
};

let historyLog = [];

const ROLE_LABELS = ["Línea de Choque", "Cazador / Jungla", "Línea de Medio", "Soporte / Merodeo", "Línea de Farmeo"];

function inicializarEstructuraCasillas() {
  const bPicks = document.getElementById('blue-picks-container');
  bPicks.innerHTML = '';
  for(let i=0; i<5; i++) {
    bPicks.innerHTML += `
      <div class="pick-slot" id="slot-pick-blue-${i}">
        <img src="" class="slot-avatar" id="avatar-pick-blue-${i}" style="display:none;">
        <div class="slot-avatar" id="placeholder-pick-blue-${i}" style="background:#1a1a22; border:1px dashed #3a3a46;"></div>
        <div class="slot-info">
          <div class="slot-role-label">${ROLE_LABELS[i]}</div>
          <div class="slot-hero-name empty" id="name-pick-blue-${i}">Buscando selección...</div>
        </div>
      </div>`;
  }

  const rPicks = document.getElementById('red-picks-container');
  rPicks.innerHTML = '';
  for(let i=0; i<5; i++) {
    rPicks.innerHTML += `
      <div class="pick-slot" id="slot-pick-red-${i}">
        <img src="" class="slot-avatar" id="avatar-pick-red-${i}" style="display:none;">
        <div class="slot-avatar" id="placeholder-pick-red-${i}" style="background:#1a1a22; border:1px dashed #3a3a46;"></div>
        <div class="slot-info">
          <div class="slot-role-label">${ROLE_LABELS[i]}</div>
          <div class="slot-hero-name empty" id="name-pick-red-${i}">Buscando selección...</div>
        </div>
      </div>`;
  }

  const bBans = document.getElementById('blue-bans-container');
  bBans.innerHTML = '';
  for(let i=0; i<5; i++) {
    bBans.innerHTML += `<div class="ban-slot" id="slot-ban-blue-${i}"></div>`;
  }

  const rBans = document.getElementById('red-bans-container');
  rBans.innerHTML = '';
  for(let i=0; i<5; i++) {
    rBans.innerHTML += `<div class="ban-slot" id="slot-ban-red-${i}"></div>`;
  }
}

function cargarBaseDatos() {
  Papa.parse(CSV_URL, {
    download: true,
    skipEmptyLines: true,
    complete: function(results) {
      const rows = results.data.slice(1);
      rows.forEach(cols => {
        if (!cols[1]) return;

        let fuertesNames = [cols[26], cols[29], cols[32], cols[35], cols[38], cols[41]]
          .filter(Boolean).map(n => n.trim().toLowerCase());
          
        let debilesNames = [cols[44], cols[47], cols[50], cols[53], cols[54], cols[59]]
          .filter(Boolean).map(n => n.trim().toLowerCase());
          
        let sinergiasNames = [cols[11], cols[14], cols[17], cols[20], cols[23]]
          .filter(Boolean).map(n => n.trim().toLowerCase());

        heroesData.push({
          nombre: cols[1].trim(),
          imagen: cols[3] ? cols[3].trim() : "",
          roles: [cols[5], cols[6], cols[7]].filter(Boolean).map(r => r.trim()),
          fuerteContra: fuertesNames, 
          debilContra: debilesNames,
          sinergiaCon: sinergiasNames
        });
      });
      heroesData.sort((a,b) => a.nombre.localeCompare(b.nombre));
      actualizarInterfazTurnos();
      renderSelectorHeroes();
    }
  });
}

function estaSeleccionado(nombreHeroe) {
  let lower = nombreHeroe.toLowerCase();
  for(let i=0; i<5; i++) {
    if(state.blue.picks[i] && state.blue.picks[i].nombre.toLowerCase() === lower) return true;
    if(state.red.picks[i] && state.red.picks[i].nombre.toLowerCase() === lower) return true;
    if(state.blue.bans[i] && state.blue.bans[i].nombre.toLowerCase() === lower) return true;
    if(state.red.bans[i] && state.red.bans[i].nombre.toLowerCase() === lower) return true;
  }
  return false;
}

function renderSelectorHeroes() {
  const grid = document.getElementById('catalogGridZone');
  grid.innerHTML = '';

  heroesData.forEach(hero => {
    if (currentRoleFilter !== 'all' && !hero.roles.includes(currentRoleFilter)) return;
    if (currentSearchQuery && !hero.nombre.toLowerCase().includes(currentSearchQuery)) return;

    const item = document.createElement('div');
    const ocupado = estaSeleccionado(hero.nombre);
    
    item.className = `hero-selection-item ${ocupado ? 'disabled-hero' : ''}`;
    item.innerHTML = `<img src="${hero.imagen}" title="${hero.nombre}">`;

    if(!ocupado && currentStepIndex < DRAFT_FLOW.length) {
      item.addEventListener('click', () => {
        ejecutarAsignacionDraft(hero);
      });
    }
    grid.appendChild(item);
  });
}

function ejecutarAsignacionDraft(hero) {
  if(currentStepIndex >= DRAFT_FLOW.length) return;
  
  const pasoActual = DRAFT_FLOW[currentStepIndex];
  
  historyLog.push(JSON.parse(JSON.stringify(state)));
  
  state[pasoActual.team][pasoActual.type === 'pick' ? 'picks' : 'bans'][pasoActual.slot] = hero;
  
  currentStepIndex++;
  
  actualizarInterfazTurnos();
  renderSelectorHeroes();
  calcularRecomendacionesAnaliticas();
}

function deshacerUltimoPaso() {
  if(historyLog.length === 0) return;
  state = historyLog.pop();
  currentStepIndex--;
  actualizarInterfazTurnos();
  renderSelectorHeroes();
  calcularRecomendacionesAnaliticas();
}

function reiniciarDraft() {
  currentStepIndex = 0;
  historyLog = [];
  state = {
    blue: { picks: [null, null, null, null, null], bans: [null, null, null, null, null] },
    red:  { picks: [null, null, null, null, null], bans: [null, null, null, null, null] }
  };
  actualizarInterfazTurnos();
  renderSelectorHeroes();
  calcularRecomendacionesAnaliticas();
}

function actualizarInterfazTurnos() {
  document.querySelectorAll('.pick-slot, .ban-slot').forEach(el => el.classList.remove('active-turn'));

  for(let i=0; i<5; i++) {
    actualizarVisualSlot('blue', 'pick', i);
    actualizarVisualSlot('red', 'pick', i);
    actualizarVisualSlot('blue', 'ban', i);
    actualizarVisualSlot('red', 'ban', i);
  }

  if(currentStepIndex >= DRAFT_FLOW.length) {
    document.getElementById('phase-label').innerText = "Draft Terminado";
    document.getElementById('phase-label').style.color = "#22c55e";
    document.getElementById('instruction-label').innerText = "Estrategias de combate listas";
    return;
  }

  const pasoFuturo = DRAFT_FLOW[currentStepIndex];
  document.getElementById('phase-label').innerText = pasoFuturo.type === 'ban' ? "Fase de Bloqueos (BAN)" : "Fase de Selección (PICK)";
  document.getElementById('phase-label').style.color = pasoFuturo.type === 'ban' ? "#eab308" : "#4f6edb";
  document.getElementById('instruction-label').innerText = `Turno de: ${pasoFuturo.label}`;

  const targetId = `slot-${pasoFuturo.type}-${pasoFuturo.team}-${pasoFuturo.slot}`;
  const targetEl = document.getElementById(targetId);
  if(targetEl) targetEl.classList.add('active-turn');

  document.getElementById('btn-undo').disabled = historyLog.length === 0;
}

function actualizarVisualSlot(team, type, index) {
  const hero = state[team][type === 'picks' || type === 'pick' ? 'picks' : 'bans'][index];
  
  if(type === 'pick') {
    const imgEl = document.getElementById(`avatar-pick-${team}-${index}`);
    const placeholderEl = document.getElementById(`placeholder-pick-${team}-${index}`);
    const nameEl = document.getElementById(`name-pick-${team}-${index}`);
    
    if(hero) {
      imgEl.src = hero.imagen;
      imgEl.style.display = "block";
      placeholderEl.style.display = "none";
      nameEl.innerText = hero.nombre;
      nameEl.classList.remove('empty');
    } else {
      imgEl.style.display = "none";
      placeholderEl.style.display = "block";
      nameEl.innerText = "Buscando selección...";
      nameEl.classList.add('empty');
    }
  } else {
    const banBox = document.getElementById(`slot-ban-${team}-${index}`);
    if(hero) {
      banBox.innerHTML = `<img src="${hero.imagen}" class="ban-avatar" title="${hero.nombre}">`;
    } else {
      banBox.innerHTML = "";
    }
  }
}

function calcularRecomendacionesAnaliticas() {
  const blueListEl = document.getElementById('blue-rec-list');
  const redListEl = document.getElementById('red-rec-list');

  let bluePicksActivos = state.blue.picks.filter(Boolean);
  let redPicksActivos = state.red.picks.filter(Boolean);

  if(bluePicksActivos.length === 0 && redPicksActivos.length === 0) {
    blueListEl.innerHTML = '<div style="font-size:11px; color:#555566; text-align:center; padding:10px;">Inicia el draft para calcular sinergias</div>';
    redListEl.innerHTML = '<div style="font-size:11px; color:#555566; text-align:center; padding:10px;">Inicia el draft para calcular counters</div>';
    return;
  }

  let matrizPuntajes = {};
  heroesData.forEach(h => {
    matrizPuntajes[h.nombre] = { heroe: h, scoreAzul: 0, scoreRojo: 0 };
  });

  // EVALUACIÓN DE SINERGIAS INTERNAS
  bluePicksActivos.forEach(bp => {
    bp.sinergiaCon.forEach(name => {
      let match = heroesData.find(x => x.nombre.toLowerCase() === name);
      if(match) matrizPuntajes[match.nombre].scoreAzul += 3;
    });
  });

  redPicksActivos.forEach(rp => {
    rp.sinergiaCon.forEach(name => {
      let match = heroesData.find(x => x.nombre.toLowerCase() === name);
      if(match) matrizPuntajes[match.nombre].scoreRojo += 3;
    });
  });

  // EVALUACIÓN DE COUNTERS DIRECTOS INTER-EQUIPOS
  redPicksActivos.forEach(rp => {
    let matchHero = heroesData.find(x => x.nombre.toLowerCase() === rp.nombre.toLowerCase());
    if(matchHero) {
      matchHero.debilContra.forEach(name => {
        let rec = heroesData.find(x => x.nombre.toLowerCase() === name);
        if(rec) matrizPuntajes[rec.nombre].scoreAzul += 4;
      });
      matchHero.fuerteContra.forEach(name => {
        let rec = heroesData.find(x => x.nombre.toLowerCase() === name);
        if(rec) matrizPuntajes[rec.nombre].scoreRojo += 2;
      });
    }
  });

  bluePicksActivos.forEach(bp => {
    let matchHero = heroesData.find(x => x.nombre.toLowerCase() === bp.nombre.toLowerCase());
    if(matchHero) {
      matchHero.debilContra.forEach(name => {
        let rec = heroesData.find(x => x.nombre.toLowerCase() === name);
        if(rec) matrizPuntajes[rec.nombre].scoreRojo += 4;
      });
      matchHero.fuerteContra.forEach(name => {
        let rec = heroesData.find(x => x.nombre.toLowerCase() === name);
        if(rec) matrizPuntajes[rec.nombre].scoreAzul += 2;
      });
    }
  });

  let listaFinal = Object.values(matrizPuntajes).filter(item => !estaSeleccionado(item.heroe.nombre));

  let recAzul = [...listaFinal].sort((a,b) => b.scoreAzul - a.scoreAzul).slice(0, 4);
  let recRojo = [...listaFinal].sort((a,b) => b.scoreRojo - a.scoreRojo).slice(0, 4);

  inyectarBloqueRecomendado(blueListEl, recAzul, 'azul');
  inyectarBloqueRecomendado(redListEl, recRojo, 'rojo');
}

function inyectarBloqueRecomendado(contenedor, items, bando) {
  contenedor.innerHTML = "";
  let validos = items.filter(x => (bando === 'azul' ? x.scoreAzul : x.scoreRojo) > 0);

  if(validos.length === 0) {
    contenedor.innerHTML = '<div style="font-size:11px; color:#555566; text-align:center; padding:10px;">Analizando siguientes elecciones...</div>';
    return;
  }

  validos.forEach(item => {
    let pts = bando === 'azul' ? item.scoreAzul : item.scoreRojo;
    let colorPts = bando === 'azul' ? '#4ade80' : '#f87171';
    
    contenedor.innerHTML += `
      <div class="mini-rec-card">
        <div class="mini-rec-left">
          <img src="${item.heroe.imagen}" class="mini-rec-avatar">
          <div class="mini-rec-name">${item.heroe.nombre}</div>
        </div>
        <div class="mini-rec-value" style="color: ${colorPts}">+${pts} pts</div>
      </div>`;
  });
}
