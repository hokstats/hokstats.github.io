<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tier List HoK</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body {
  background: #1c1c1f;
  font-family: Arial, sans-serif;
  color: #7b7a8e;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 1100px;
  margin: auto;
}

.main-box {
  background: #31313c;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid #1c1c1f;
  padding: 30px; /* 👈 Colchón idéntico al de la página Acerca de */
}

.tabs-container {
  padding: 10px;
  background: #31313c;
  border-bottom: 1px solid #1c1c1f;
}

/* 🔥 contenedor flexible */
.tabs-wrapper {
  display: flex;
  gap: 10px;
  width: 100%;
  align-items: center;
}

.tabs {
  display: flex;
  flex: 1 1 auto;
  min-width: 0;
  border: 1px solid #444452;
  border-radius: 4px;
  overflow: hidden;
}

.tab {
  flex: 1 1 0;
  min-width: 0;
  text-align: center;
  padding: 8px 10px;
  cursor: pointer;
  border-right: 1px solid #444452;
  background: #31313c;
  font-size: 12px;
  font-weight: 500;
}

.tab:last-child {
  border-right: none;
}

.tab.active {
  color: white;
  background: #4f6edb;
}

.search-box {
  width: 180px;
  flex: 0 0 180px;
}

.search-box input {
  width: 100%;
  padding: 7px 10px;
  border-radius: 4px;
  border: 1px solid #444452;
  background: #282830;
  color: #ccc;
  box-sizing: border-box;
  font-size: 12px;
  outline: none;
}

.search-box input::placeholder {
  color: #777;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  background: #282830;
}

thead tr {
  border-bottom: 1px solid #1c1c1f;
}

thead th {
  padding: 8px 4px;    
  font-size: 11px;    
  color: #7b7a8e;
  font-weight: bold !important;  
  cursor: pointer;
}

tbody tr {
  background: #31313c;
  border-top: 1px solid #1c1c1f;
  border-bottom: 1px solid #1c1c1f;
}

tbody tr:hover {
  background: #3a3a46;
}

td {
  padding: 6px 4px;   
}

.col-pos { width: 5%; text-align: center; }
.col-hero { width: 20%; }
.col-tier { width: 6%; text-align: center; }
.col-rol { width: 10%; text-align: center; }
.col-num { width: 9%; text-align: center; }

.champion {
  display: flex;
  align-items: center;
  gap: 12px;
  color: white;
  padding-left: 8px;
}

.champion img {
  width: 36px;
  height: 36px;
  border-radius: 6px;
}

.champion span {
  font-size: 11px; 
  font-weight: bold;
}

.tier-badge {
  width: 20px;
  height: 20px;
  margin: auto;
  transform: rotate(45deg);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #1c1c1f;
}

.tier-badge span {
  transform: rotate(-45deg);
  color: white;
  font-weight: bold;
  font-size: 11px; 
}

.tier-S { background: #1c7ed6; }
.tier-A { background: #099268; }
.tier-B { background: #ff922b; }
.tier-C { background: #868e96; }

.role-cell {
  display: flex;
  justify-content: center;   
  align-items: center;       
  gap: 6px;
  height: 32px;
}

.role-cell img {
  width: 25px;              
  height: 25px;
  object-fit: contain;
  opacity: 0.50;            
  filter: brightness(0.90); 
}

.win-cell, .pick-cell, .ban-cell {
  font-size: 12px;
  font-weight: bold;
}

.win-cell  { color: #4ade80; } 
.pick-cell { color: #ccc; }    
.ban-cell  { color: #f87171; } 

.logo-text {
  font-family: monospace;
  font-size: 22px;
  color: white;
  margin-bottom: 10px;
  margin-left: 4px;
  letter-spacing: 1px;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.view-tabs {
  display: flex;
  gap: 6px;
}

.view-tab {
  padding: 6px 12px;
  font-size: 12px;
  background: #31313c;
  border: 1px solid #444452;
  cursor: pointer;
  color: #a0a0b5;
  text-decoration: none; /* Asegura enlace limpio */
}

.view-tab.active {
  background: #4f6edb;
  color: white;
}

::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: #1c1c1f; }
::-webkit-scrollbar-thumb { background: #444452; border-radius: 6px; }

#scatterChart {
  background: #282830;
  border-radius: 6px;
  margin-top: 20px;
  padding: 15px;
}
</style>
</head>

<body>

<div class="container">

  <div class="top-bar">
    <div class="logo-text">HoKstats</div>

    <div class="view-tabs">
      <a href="index.html" class="view-tab active">Estadísticas</a>
      <a href="counter.html" class="view-tab">Counters</a>
      <a href="acerca.html" class="view-tab">Acerca de</a>
    </div>
  </div>

  <div class="main-box">
    
    <div class="tabs-container">
      <div class="tabs-wrapper">

        <div class="tabs">
          <div class="tab active" data-role="all">Todo</div>
          <div class="tab" data-role="Choque">Choque</div>
          <div class="tab" data-role="Cazador">Cazador</div>
          <div class="tab" data-role="Medio">Medio</div>
          <div class="tab" data-role="Merodeo">Merodeo</div>
          <div class="tab" data-role="Farmeo">Farmeo</div>
        </div>

        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Buscar héroe...">
        </div>

      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th class="col-pos" onclick="sortTable('pos')">Pos</th>
          <th class="col-hero">Héroe</th>
          <th class="col-tier" onclick="sortTable('tier')">Tier</th>
          <th class="col-rol">Rol</th>
          <th class="col-num" onclick="sortTable('win')">Win Rate</th>
          <th class="col-num" onclick="sortTable('pick')">Pick Rate</th>
          <th class="col-num" onclick="sortTable('ban')">Ban Rate</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

  </div>
      
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTO4rMY_drrjKMx3KTdjAaSrH6GenxyZ7YzLPT7oiZ_pNYm6EKG-yJPfmbRcZgYGGi2gERA1Gciw-Fy/pub?gid=538223640&single=true&output=csv";

let allData = [];
let currentSort = { key: null, asc: false };
let currentRole = "all";
let currentSearch = "";

function cleanNumber(val){
  if (!val) return 0;
  return parseFloat(val.toString().replace(/,/g, '').replace('%', '').trim()) || 0;
}
  
function parseCSV(text) {
  return Papa.parse(text.trim(), { skipEmptyLines: true }).data;
}

fetch(CSV_URL)
.then(r => r.text())
.then(csv => {
  const data = parseCSV(csv).slice(1);

  data.forEach(cols => {
    if (!cols[1]) return;

    allData.push({
      nombre: cols[1],
      imagen: cols[3],
      roles: [cols[5], cols[6], cols[7]].filter(Boolean),
      roleImgs: [cols[64], cols[65], cols[66]].map(x => x.trim()).filter(x => x && x !== "#N/A"),
      win: cleanNumber(cols[56]),
      pick: cleanNumber(cols[57]),
      ban: cleanNumber(cols[58]),
      tier: cols[62],
      pos: cleanNumber(cols[63])
    });
  });

  currentSort = { key: 'pos', asc: true };
  allData.sort((a, b) => a.pos - b.pos);

  applyFilters();
});

function applyFilters() {
  let data = [...allData];

  if (currentRole !== "all") {
    data = data.filter(i => i.roles.includes(currentRole));
  }

  if (currentSearch) {
    data = data.filter(i => i.nombre.toLowerCase().includes(currentSearch));
  }

  renderTable(data);
}

function renderTable(data) {
  const tbody = document.querySelector("tbody");
  tbody.innerHTML = "";

  data.forEach(item => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td class="col-pos" style="font-size:11px; color:#a0a0b5; text-align:center;">${item.pos}</td>
    
      <td class="col-hero">
        <div class="champion">
          <img src="${item.imagen}">
          <span>${item.nombre}</span>
        </div>
      </td>

      <td class="col-tier">
        <div class="tier-badge tier-${item.tier}">
          <span>${item.tier}</span>
        </div>
      </td>

      <td class="col-rol">
        <div class="role-cell">
          ${item.roleImgs.map(img => `<img src="${img}">`).join("")}
        </div>
      </td>

      <td class="col-num win-cell">${item.win}%</td>
      <td class="col-num pick-cell">${item.pick}%</td>
      <td class="col-num ban-cell">${item.ban}%</td>
    `;

    tbody.appendChild(tr);
  });
}

/* Eventos Filtros por Rol */
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentRole = tab.dataset.role;
    applyFilters();
  });
});

/* Buscador interactivo */
document.getElementById("searchInput").addEventListener("input", e => {
  currentSearch = e.target.value.toLowerCase();
  applyFilters();
});

/* Algoritmo de ordenamiento por columnas numéricas o texto */
function sortTable(key) {
  let asc = false;
  if (currentSort.key === key) {
    asc = !currentSort.asc;
  } else {
    asc = (key === 'pos' || key === 'tier'); 
  }
  
  currentSort = { key, asc };

  allData.sort((a, b) => {
    let valA = a[key];
    let valB = b[key];

    if (key === 'tier') {
      return asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
    }
    return asc ? valA - valB : valB - valA;
  });

  applyFilters();
}
</script>

</body>
</html>
