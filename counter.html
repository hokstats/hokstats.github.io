<!DOCTYPE html>
<html lang="es" style="scrollbar-gutter: stable;">
<head>
<meta charset="UTF-8">
<title>Counters - HoKstats</title>
<style>
/* 📊 IDENTIDAD GLOBAL UNIFICADA Y CONTROL DE LAYOUT SHIFT */
* {
  box-sizing: border-box;
}

body {
  background: #1c1c1f;
  font-family: Arial, sans-serif;
  color: #7b7a8e;
  margin: 0;
  padding: 24px 0; /* Relleno superior/inferior idéntico */
  user-select: none;
}

/* MARCO MAESTRO: Bloquea los límites horizontales milimétricamente en todo el sitio */
.container {
  width: 100%;
  max-width: 1160px; /* 1100px útiles + 60px de padding total acumulado */
  margin: 0 auto;
  padding: 0 30px;
}

/* BARRA SUPERIOR ESTATICA */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: flex-end; /* Alineación perfecta al piso de la pestaña */
  margin-bottom: 20px;
  padding: 0 4px;
}

.logo-text {
  font-family: monospace;
  font-size: 22px;
  color: white;
  margin: 0;
  letter-spacing: 1px;
  line-height: 1;
}

.view-tabs {
  display: flex;
  gap: 6px;
}

.view-tab {
  padding: 6px 12px;
  font-size: 12px;
  background: #31313c;
  border: 1px solid #444452;
  cursor: pointer;
  color: #a0a0b5;
  text-decoration: none;
  white-space: nowrap;
  line-height: 1.2;
}

.view-tab.active {
  background: #4f6edb;
  color: white;
  border-color: #4f6edb;
}

/* 📦 CAJA MAESTRA UNIVERSAL (REPLICA EXACTA EN TODAS LAS PÁGINAS) */
.main-box {
  background: #31313c;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid #444452; /* Borde unificado de alta visibilidad */
  width: 100%;
}

/* CONTENEDOR INTERNO PARA DAR CONTINUIDAD AL ANCHO DE CONTENIDO */
.content-padding-zone {
  padding: 40px 30px 40px 30px; /* Relleno lateral idéntico de 30px */
}

/* 🔍 CONTENEDOR DE FILTROS IMPORTADO DE STATS.HTML */
.tabs-container {
  padding: 0 0 20px 0;
  background: #31313c;
}

.tabs-wrapper {
  display: flex;
  gap: 10px;
  width: 100%;
  align-items: center;
}

.tabs {
  display: flex;
  flex: 1 1 auto;
  min-width: 0;
  border: 1px solid #444452;
  border-radius: 4px;
  overflow: hidden;
}

.role-tab {
  flex: 1 1 0;
  min-width: 0;
  text-align: center;
  padding: 8px 10px;
  cursor: pointer;
  border: none;
  border-right: 1px solid #444452;
  background: #31313c;
  font-size: 12px;
  font-weight: 500;
  color: #7b7a8e;
  outline: none;
  transition: all 0.2s ease;
}

.role-tab:last-child {
  border-right: none;
}

.role-tab:hover {
  color: white;
  background: #3a3a46;
}

.role-tab.active {
  color: white;
  background: #4f6edb;
}

/* 🔍 buscador */
.search-box {
  width: 180px;
  flex: 0 0 180px;
}

.search-box input {
  width: 100%;
  padding: 7px 10px;
  border-radius: 4px;
  border: 1px solid #444452;
  background: #282830;
  color: #ccc;
  box-sizing: border-box;
  font-size: 12px;
  outline: none;
}

.search-box input::placeholder {
  color: #777;
}

/* 🎴 GRILLA DEL CATÁLOGO */
.catalog-padding-zone {
  padding: 0;
}

.catalog-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

/* TARJETA COMPACTA */
.hero-compact-card {
  background: #24242b;
  border: 1px solid #3a3a46;
  border-radius: 6px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  box-sizing: border-box;
  overflow: hidden;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.hero-compact-card:hover {
  border-color: #4f6edb;
  background: #292932;
}

.card-avatar {
  width: 48px;
  height: 48px;
  border-radius: 5px;
  object-fit: cover;
  border: 1px solid #444452;
  flex-shrink: 0;
  align-self: center;
}

.card-meta-info {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
  flex: 1;
}

.card-hero-name {
  color: white;
  font-weight: bold;
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.3px;
}

.card-relations-zone {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.card-relation-row {
  display: flex;
  align-items: center;
  gap: 7px;
}

.card-relation-label {
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 0.7px;
  text-transform: uppercase;
  flex-shrink: 0;
  width: 52px;
  line-height: 1;
}

.rel-strong-label { color: #fb923c; }
.rel-weak-label   { color: #c084fc; }
.rel-syn-label    { color: #4ade80; }

.card-relation-divider {
  width: 1px;
  height: 14px;
  background: #36363f;
  flex-shrink: 0;
}

.card-relation-dots {
  display: flex;
  gap: 4px;
  flex-wrap: nowrap;
  align-items: center;
}

.rel-dot {
  width: 26px;
  height: 26px;
  border-radius: 5px;
  object-fit: cover;
  flex-shrink: 0;
  transition: transform 0.15s ease, filter 0.15s ease;
}
.rel-dot:hover { transform: scale(1.12); filter: brightness(1.15); }

.rel-dot-strong {
  border: 1.5px solid rgba(249,115,22,0.55);
  box-shadow: inset 0 0 0 26px rgba(249,115,22,0.06), 0 0 6px rgba(249,115,22,0.12);
}
.rel-dot-weak {
  border: 1.5px solid rgba(168,85,247,0.55);
  box-shadow: inset 0 0 0 26px rgba(168,85,247,0.06), 0 0 6px rgba(168,85,247,0.12);
}
.rel-dot-syn {
  border: 1.5px solid rgba(34,197,94,0.55);
  box-shadow: inset 0 0 0 26px rgba(34,197,94,0.06), 0 0 6px rgba(34,197,94,0.12);
}

.rel-dot-empty {
  font-size: 9px;
  color: #3a3a4a;
  font-style: italic;
  line-height: 1;
}

/* 🎚️ INTERFAZ DE DETALLE SEGURO */
.detail-view-container {
  display: none;
  padding: 0;
}

.detail-top-dashboard {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 20px;
}

.focus-hero-card {
  background: #24242b;
  border: 1px solid #444452;
  border-radius: 6px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-grow: 1;
  height: 87px; /* Altura calculada para encajar simétricamente con el panel de control */
}

.focus-avatar {
  width: 55px;
  height: 55px;
  border-radius: 4px;
  object-fit: cover;
  border: 2px solid #4f6edb;
}

.focus-details h2 { margin: 0; color: white; font-size: 16px; }
.focus-roles { display: flex; gap: 6px; margin-top: 4px; }
.role-badge {
  background: #31313c; color: #a0a0b5; font-size: 10px; padding: 2px 6px; border-radius: 4px; border: 1px solid #444452; text-transform: uppercase;
}

/* BLOQUE DE CONTROL EXPLICATIVO IN-SITU */
.analysis-control-panel {
  background: #24242b;
  border: 1px solid #444452;
  border-radius: 6px;
  padding: 12px 16px;
  width: 440px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-sizing: border-box;
}

.control-action-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.btn-back {
  background: #31313c;
  border: 1px solid #444452;
  color: white;
  padding: 6px 12px;
  font-size: 11px;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
}
.btn-back:hover { border-color: #7b7a8e; }

.btn-toggle-mode {
  background: #31313c;
  border: 1px solid #444452;
  color: #7b7a8e;
  padding: 6px 12px;
  font-size: 11px;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.btn-toggle-mode.active {
  background: #4f6edb;
  color: white;
  border-color: #4f6edb;
}

.analysis-explanation-text {
  font-size: 10.5px;
  line-height: 14px;
  color: #7b7a8e;
  border-top: 1px solid #31313c;
  padding-top: 8px;
}
.analysis-explanation-text strong { color: #fff; }

/* REJILLA DE RELACIONES */
.relationships-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.column-card {
  background: #24242b;
  border-radius: 6px;
  padding: 12px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  height: 440px;
}

.col-strong { border: 1px solid #f97316; }
.col-weak { border: 1px solid #a855f7; }
.col-synergy { border: 1px solid #22c55e; }

.column-header {
  font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid #31313c;
}
.col-strong .column-header { color: #fb923c; }
.col-weak .column-header { color: #c084fc; }
.col-synergy .column-header { color: #4ade80; }

.cards-list-container {
  display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex-grow: 1; padding-right: 2px;
}

.mini-hero-card {
  display: flex; align-items: center; gap: 10px; background: #1c1c1f; border: 1px solid #31313c; border-radius: 4px; padding: 6px; cursor: pointer;
}
.mini-hero-card:hover { border-color: #555; }
.mini-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
.mini-name { color: white; font-weight: bold; font-size: 12px; }
.mini-roles { font-size: 10px; color: #7b7a8e; }

.empty-column-state { font-size: 11px; color: #555566; text-align: center; margin: auto; }
.cards-list-container::-webkit-scrollbar { width: 4px; }
.cards-list-container::-webkit-scrollbar-thumb { background: #444452; border-radius: 2px; }

/* scrollbar modo oscuro */
::-webkit-scrollbar {
  width: 10px;
}
::-webkit-scrollbar-track {
  background: #1c1c1f;
}
::-webkit-scrollbar-thumb {
  background: #444452;
  border-radius: 6px;
}
::-webkit-scrollbar-thumb:hover {
  background: #5a5a6b;
}

/* 🌐 SELECTOR DE IDIOMA */
.lang-selector {
  display: flex;
  gap: 4px;
  align-items: center;
  margin-right: 8px;
}
.lang-btn {
  background: none;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 3px 5px;
  font-size: 16px;
  cursor: pointer;
  line-height: 1;
  opacity: 0.45;
  color: white;
  transition: opacity 0.2s ease, border-color 0.2s ease;
}
.lang-btn:hover { opacity: 0.85; }
.lang-btn.active { opacity: 1; border-color: #444452; }
</style>
</head>
<body>

<div class="container">

  <div class="top-bar">
    <div class="logo-text">HoKstats</div>
    <div class="view-tabs">
      <div class="lang-selector">
        <button class="lang-btn" onclick="setLang('es')" title="Español">🇪🇸</button>
        <button class="lang-btn" onclick="setLang('pt')" title="Português">🇧🇷</button>
        <button class="lang-btn" onclick="setLang('en')" title="English">🇺🇸</button>
      </div>
      <a href="index.html" class="view-tab" data-i18n="nav_general">General</a>
      <a href="stats.html" class="view-tab" data-i18n="nav_stats">Estadísticas</a>
      <a href="counter.html" class="view-tab active" data-i18n="nav_counters">Counters</a>
      <a href="planner.html" class="view-tab" data-i18n="nav_planner">Planner</a>
      <a href="draft.html" class="view-tab" data-i18n="nav_draft">Draft</a>
      <a href="acerca.html" class="view-tab" data-i18n="nav_about">Acerca de</a>
    </div>
  </div>

  <div class="main-box">
    <div class="content-padding-zone">
    
      <div class="tabs-container" id="filtersBlock">
        <div class="tabs-wrapper">
          <div class="tabs">
            <button class="role-tab active" data-role="all" data-i18n="role_all">Todo</button>
            <button class="role-tab" data-role="Choque" data-i18n="role_choque">Choque</button>
            <button class="role-tab" data-role="Cazador" data-i18n="role_cazador">Cazador</button>
            <button class="role-tab" data-role="Medio" data-i18n="role_medio">Medio</button>
            <button class="role-tab" data-role="Merodeo" data-i18n="role_merodeo">Merodeo</button>
            <button class="role-tab" data-role="Farmeo" data-i18n="role_farmeo">Farmeo</button>
          </div>
          <div class="search-box">
            <input type="text" id="searchHero" data-i18n-placeholder="search_placeholder" placeholder="Buscar héroe...">
          </div>
        </div>
      </div>

      <div id="catalog-view" class="catalog-padding-zone">
        <div class="catalog-grid" id="catalogGridZone"></div>
      </div>

      <div id="detail-view" class="detail-view-container">
        
        <div class="detail-top-dashboard">
          <div class="focus-hero-card">
            <img src="" class="focus-avatar" id="focus-img">
            <div class="focus-details">
              <h2 id="focus-name">-</h2>
              <div class="focus-roles" id="focus-roles-zone"></div>
            </div>
          </div>

          <div class="analysis-control-panel">
            <div class="control-action-row">
              <button class="btn-back" onclick="volverAlCatalogo()" data-i18n="btn_back">⬅️ Volver</button>
              <button class="btn-toggle-mode" id="toggleAnalysisMode" onclick="cambiarModoAnalisis()" data-i18n="btn_cross_off">MODO CRUZADO: OFF</button>
            </div>
            <div class="analysis-explanation-text" id="explanationText"></div>
          </div>
        </div>

        <div class="relationships-grid">
          <div class="column-card col-strong">
            <div class="column-header" data-i18n="col_strong">⚔️ Es Fuerte Contra</div>
            <div class="cards-list-container" id="strong-list"></div>
          </div>

          <div class="column-card col-weak">
            <div class="column-header" data-i18n="col_weak">⚠️ Es Débil Contra</div>
            <div class="cards-list-container" id="weak-list"></div>
          </div>

          <div class="column-card col-synergy">
            <div class="column-header" data-i18n="col_synergy">🤝 Excelentes Sinergias</div>
            <div class="cards-list-container" id="synergy-list"></div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTO4rMY_drrjKMx3KTdjAaSrH6GenxyZ7YzLPT7oiZ_pNYm6EKG-yJPfmbRcZgYGGi2gERA1Gciw-Fy/pub?gid=538223640&single=true&output=csv";

const TXT_MODO_NORMAL = `<strong>MODO NORMAL:</strong> Muestra las relaciones analíticas oficiales registradas en el servidor de origen (China), optimizadas con métricas de rendimiento del servidor global y variaciones específicas del metajuego actual.`;
const TXT_MODO_CRUZADO = `<strong>MODO CRUZADO:</strong> Ejecuta un escaneo inverso bidireccional en la matriz de datos. Descubre y añade automáticamente interacciones ocultas de héroes que impactan a este personaje desde sus propios perfiles competitivos.`;

let heroesData = [];
let currentRoleFilter = 'all';
let currentSearchQuery = '';
let selectedHeroInFocus = null;
let bidireccionalMode = false;

function obtenerColorWinrate(wrString) {
  let num = parseFloat(wrString.replace('%', ''));
  if (isNaN(num)) return '#7b7a8e';
  if (num >= 53) return '#4ade80'; 
  if (num >= 51) return '#10b981'; 
  if (num >= 49) return '#a0a0b5'; 
  if (num >= 47) return '#f97316'; 
  return '#f87171'; 
}

function cargarBaseDatos() {
  Papa.parse(CSV_URL, {
    download: true,
    skipEmptyLines: true,
    complete: function(results) {
      const rows = results.data.slice(1);
      rows.forEach(cols => {
        if (!cols[1]) return;
        
        let fuertesNames = [cols[26], cols[29], cols[32], cols[35], cols[38], cols[41]]
          .filter(Boolean).map(n => n.trim().toLowerCase());
          
        let debilesNames = [cols[44], cols[47], cols[50], cols[53], cols[54], cols[59]]
          .filter(Boolean).map(n => n.trim().toLowerCase());
          
        let sinergiasNames = [cols[11], cols[14], cols[17], cols[20], cols[23]]
          .filter(Boolean).map(n => n.trim().toLowerCase());

        let tierReal = cols[62] ? cols[62].trim().toUpperCase() : "T2";

        heroesData.push({
          nombre: cols[1].trim(),
          imagen: cols[3] ? cols[3].trim() : "",
          roles: [cols[5], cols[6], cols[7]].filter(Boolean).map(r => r.trim()),
          winrate: cols[8] ? cols[8].trim() : "0%",
          pickrate: cols[9] ? cols[9].trim() : "0%",
          banrate: cols[10] ? cols[10].trim() : "0%",
          tier: tierReal, 
          fuerteContra: fuertesNames, 
          debilContra: debilesNames,
          sinergiaCon: sinergiasNames
        });
      });
      heroesData.sort((a,b) => a.nombre.localeCompare(b.nombre));
      renderCatalogo();
    }
  });
}

function normalizeStr(s) {
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
}

function buildRelationRow(nameList, labelClass, labelText, dotClass) {
  const maxDots = 5;
  const slice = nameList.slice(0, maxDots);
  if (slice.length === 0) {
    return `
      <div class="card-relation-row">
        <span class="card-relation-label ${labelClass}">${labelText}</span>
        <div class="card-relation-divider"></div>
        <span class="rel-dot-empty">—</span>
      </div>`;
  }
  const dots = slice.map(name => {
    const normName = normalizeStr(name);
    const found = heroesData.find(h => normalizeStr(h.nombre) === normName);
    if (found && found.imagen) {
      return `<img class="rel-dot ${dotClass}" src="${found.imagen}" title="${found.nombre}">`;
    }
    return '';
  }).filter(Boolean).join('');

  if (!dots) {
    return `
      <div class="card-relation-row">
        <span class="card-relation-label ${labelClass}">${labelText}</span>
        <div class="card-relation-divider"></div>
        <span class="rel-dot-empty">—</span>
      </div>`;
  }

  return `
    <div class="card-relation-row">
      <span class="card-relation-label ${labelClass}">${labelText}</span>
      <div class="card-relation-divider"></div>
      <div class="card-relation-dots">${dots}</div>
    </div>`;
}

function renderCatalogo() {
  const grid = document.getElementById('catalogGridZone');
  grid.innerHTML = '';

  heroesData.forEach(hero => {
    if (currentRoleFilter !== 'all' && !hero.roles.includes(currentRoleFilter)) return;
    if (currentSearchQuery && !hero.nombre.toLowerCase().includes(currentSearchQuery)) return;

    const wrColor = obtenerColorWinrate(hero.winrate);

    const lang = localStorage.getItem('hokstats_lang') || 'es';
    const dict = i18n[lang];

    const card = document.createElement('div');
    card.className = 'hero-compact-card';
    card.innerHTML = `
      <img src="${hero.imagen}" class="card-avatar">
      <div class="card-meta-info">
        <div class="card-hero-name">${hero.nombre}</div>
        <div class="card-relations-zone">
          ${buildRelationRow(hero.fuerteContra, 'rel-strong-label', dict.lbl_strong, 'rel-dot-strong')}
          ${buildRelationRow(hero.debilContra,   'rel-weak-label',   dict.lbl_weak,   'rel-dot-weak')}
          ${hero.sinergiaCon.length > 0 ? buildRelationRow(hero.sinergiaCon, 'rel-syn-label', dict.lbl_syn, 'rel-dot-syn') : ''}
        </div>
      </div>
    `;

    card.addEventListener('click', () => {
      desplegarFichaDetalle(hero);
    });

    grid.appendChild(card);
  });
}

function desplegarFichaDetalle(targetHero) {
  selectedHeroInFocus = targetHero;
  
  bidireccionalMode = false;
  const dict = i18n[localStorage.getItem('hokstats_lang')||'es'];
  const btn = document.getElementById('toggleAnalysisMode');
  btn.innerText = dict.btn_cross_off;
  btn.classList.remove('active');
  document.getElementById('explanationText').innerHTML = dict.txt_normal;

  document.getElementById('filtersBlock').style.display = 'none';
  document.getElementById('catalog-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';

  document.getElementById('focus-img').src = targetHero.imagen;
  document.getElementById('focus-name').innerText = targetHero.nombre;
  
  const rolesZone = document.getElementById('focus-roles-zone');
  rolesZone.innerHTML = '';
  const lang = localStorage.getItem('hokstats_lang') || 'es';
  const roleMap = {
    es: { Choque: 'Choque', Cazador: 'Cazador', Medio: 'Medio', Merodeo: 'Merodeo', Farmeo: 'Farmeo' },
    en: { Choque: 'Fighter', Cazador: 'Jungler', Medio: 'Mid', Merodeo: 'Roamer', Farmeo: 'Farmer' },
    pt: { Choque: 'Lutador', Cazador: 'Caçador', Medio: 'Meio', Merodeo: 'Suporte', Farmeo: 'Carry' }
  };
  targetHero.roles.forEach(role => {
    const translated = (roleMap[lang] && roleMap[lang][role]) ? roleMap[lang][role] : role;
    rolesZone.innerHTML += `<span class="role-badge">${translated}</span>`;
  });

  procesarRelacionesColumnas();
}

function procesarRelacionesColumnas() {
  if (!selectedHeroInFocus) return;

  const strongList = document.getElementById('strong-list');
  const weakList = document.getElementById('weak-list');
  const synergyList = document.getElementById('synergy-list');

  strongList.innerHTML = '';
  weakList.innerHTML = '';
  synergyList.innerHTML = '';

  const targetNombreLower = selectedHeroInFocus.nombre.toLowerCase();

  heroesData.forEach(hero => {
    if (hero.nombre === selectedHeroInFocus.nombre) return;
    const loopNombreLower = hero.nombre.toLowerCase();

    let esFuerte = selectedHeroInFocus.fuerteContra.includes(loopNombreLower);
    let esDebil = selectedHeroInFocus.debilContra.includes(loopNombreLower);
    let tieneSinergia = selectedHeroInFocus.sinergiaCon.includes(loopNombreLower);

    if (bidireccionalMode) {
      if (hero.debilContra.includes(targetNombreLower)) esFuerte = true;
      if (hero.fuerteContra.includes(targetNombreLower)) esDebil = true;
      if (hero.sinergiaCon.includes(targetNombreLower)) tieneSinergia = true;
    }

    if (esFuerte) crearMiniTarjetaRelacion(hero, strongList);
    if (esDebil) crearMiniTarjetaRelacion(hero, weakList);
    if (tieneSinergia) crearMiniTarjetaRelacion(hero, synergyList);
  });

  if (strongList.children.length === 0) strongList.innerHTML = `<div class="empty-column-state">${i18n[localStorage.getItem('hokstats_lang')||'es'].empty_records}</div>`;
  if (weakList.children.length === 0) weakList.innerHTML = `<div class="empty-column-state">${i18n[localStorage.getItem('hokstats_lang')||'es'].empty_records}</div>`;
  if (synergyList.children.length === 0) synergyList.innerHTML = `<div class="empty-column-state">${i18n[localStorage.getItem('hokstats_lang')||'es'].empty_records}</div>`;
}

function cambiarModoAnalisis() {
  bidireccionalMode = !bidireccionalMode;
  const btn = document.getElementById('toggleAnalysisMode');
  const exp = document.getElementById('explanationText');
  const dict = i18n[localStorage.getItem('hokstats_lang')||'es'];

  if (bidireccionalMode) {
    btn.innerText = dict.btn_cross_on;
    btn.classList.add('active');
    exp.innerHTML = dict.txt_cross;
  } else {
    btn.innerText = dict.btn_cross_off;
    btn.classList.remove('active');
    exp.innerHTML = dict.txt_normal;
  }
  procesarRelacionesColumnas();
}

function crearMiniTarjetaRelacion(hero, contenedor) {
  const mini = document.createElement('div');
  mini.className = 'mini-hero-card';
  mini.innerHTML = `
    <img src="${hero.imagen}" class="mini-avatar">
    <div>
      <div class="mini-name">${hero.nombre}</div>
      <div class="mini-roles">${hero.roles.join(' / ')}</div>
    </div>
  `;
  mini.addEventListener('click', () => {
    desplegarFichaDetalle(hero);
  });
  contenedor.appendChild(mini);
}

function volverAlCatalogo() {
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('filtersBlock').style.display = 'block';
  document.getElementById('catalog-view').style.display = 'block';
}

document.querySelectorAll('.role-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentRoleFilter = tab.dataset.role;
    renderCatalogo();
  });
});

document.getElementById('searchHero').addEventListener('input', (e) => {
  currentSearchQuery = e.target.value.toLowerCase().trim();
  renderCatalogo();
});

cargarBaseDatos();
</script>

function setLang(lang) {
  localStorage.setItem('hokstats_lang', lang);
  applyLang(lang);
}

function applyLang(lang) {
  const dict = i18n[lang];
  if (!dict) return;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (dict[key] !== undefined) el.textContent = dict[key];
  });

  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (dict[key] !== undefined) el.placeholder = dict[key];
  });

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${lang}'`));
  });

  // Actualizar textos dinámicos del JS si la vista detalle está abierta
  const toggleBtn = document.getElementById('toggleAnalysisMode');
  if (toggleBtn) {
    toggleBtn.textContent = bidireccionalMode ? dict.btn_cross_on : dict.btn_cross_off;
  }
  const expText = document.getElementById('explanationText');
  if (expText && expText.innerHTML !== '') {
    expText.innerHTML = bidireccionalMode ? dict.txt_cross : dict.txt_normal;
  }

  // Si hay una ficha abierta, re-renderizar los roles con el nuevo idioma
  if (typeof selectedHeroInFocus !== 'undefined' && selectedHeroInFocus) {
    const roleMap = {
      es: { Choque: 'Choque', Cazador: 'Cazador', Medio: 'Medio', Merodeo: 'Merodeo', Farmeo: 'Farmeo' },
      en: { Choque: 'Fighter', Cazador: 'Jungler', Medio: 'Mid', Merodeo: 'Roamer', Farmeo: 'Farmer' },
      pt: { Choque: 'Lutador', Cazador: 'Caçador', Medio: 'Meio', Merodeo: 'Suporte', Farmeo: 'Carry' }
    };
    const rolesZone = document.getElementById('focus-roles-zone');
    if (rolesZone) {
      rolesZone.innerHTML = '';
      selectedHeroInFocus.roles.forEach(role => {
        const translated = (roleMap[lang] && roleMap[lang][role]) ? roleMap[lang][role] : role;
        rolesZone.innerHTML += `<span class="role-badge">${translated}</span>`;
      });
    }
  }

  document.documentElement.lang = lang;

  // Re-renderizar catálogo para actualizar etiquetas de relaciones
  if (heroesData.length > 0) renderCatalogo();
}

const savedLang = localStorage.getItem('hokstats_lang') || 'es';
