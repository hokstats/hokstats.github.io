<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Counters - HoKstats</title>
<style>
/* 📊 REGLAS GLOBALES ESTRUCTURALES (INMUTABLES) */
body {
  background: #1c1c1f;
  font-family: Arial, sans-serif;
  color: #a0a0b5;
  margin: 0;
  padding: 20px;
  user-select: none;
}

.container {
  max-width: 1100px;
  margin: auto;
}

/* TOP-BAR IDÉNTICO */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo-text {
  font-family: monospace;
  font-size: 22px;
  color: white;
  margin-bottom: 10px;
  margin-left: 4px;
  letter-spacing: 1px;
}

.view-tabs {
  display: flex;
  gap: 6px;
}

.view-tab {
  padding: 6px 12px;
  font-size: 12px;
  background: #31313c;
  border: 1px solid #444452;
  cursor: pointer;
  color: #a0a0b5;
  text-decoration: none;
}

.view-tab.active {
  background: #4f6edb;
  color: white;
}

/* FAKE-TABLA MANTENIDA PARA EL ANCHO PERFECTO */
table.main-layout {
  width: 100%;
  border-collapse: collapse;
}

.main-box-cell {
  background: #31313c;
  border-radius: 6px;
  border: 1px solid #1c1c1f;
  padding: 20px; /* Unificado acolchado interno */
  box-sizing: border-box;
}

/* 🔍 CONTROLES DE BÚSQUEDA Y SELECCIÓN MODERNOS */
.search-container {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  align-items: center;
}

.search-input-wrapper {
  position: relative;
  flex-grow: 1;
}

.search-input-wrapper input {
  width: 100%;
  padding: 10px 14px;
  background: #24242b;
  border: 1px solid #444452;
  border-radius: 6px;
  color: white;
  font-size: 14px;
  outline: none;
  box-sizing: border-box;
}

.search-input-wrapper input:focus {
  border-color: #4f6edb;
}

/* Lista desplegable para autocompletar */
.suggestions-list {
  position: absolute;
  top: 100%;
  left: 0;
  width: 100%;
  background: #24242b;
  border: 1px solid #444452;
  border-top: none;
  border-radius: 0 0 6px 6px;
  max-height: 200px;
  overflow-y: auto;
  z-index: 10;
  display: none;
}

.suggestion-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  cursor: pointer;
  color: #ccc;
  font-size: 13px;
}

.suggestion-item:hover {
  background: #31313c;
  color: white;
}

.suggestion-item img {
  width: 28px;
  height: 28px;
  border-radius: 4px;
  object-fit: cover;
}

/* 🎴 TARJETA DEL HÉROE EN FOCO */
.focus-hero-card {
  background: #24242b;
  border: 1px solid #444452;
  border-radius: 6px;
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
  display: none; /* Se muestra dinámicamente */
}

.focus-avatar {
  width: 70px;
  height: 70px;
  border-radius: 8px;
  object-fit: cover;
  border: 2px solid #4f6edb;
}

.focus-details h2 {
  margin: 0;
  color: white;
  font-size: 20px;
}

.focus-roles {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}

.role-badge {
  background: #31313c;
  color: #a0a0b5;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid #444452;
  text-transform: uppercase;
}

/* 🏢 DASHBOARD DE COLUMNAS DE RELACIONES (TARJETAS NUEVAS) */
.relationships-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  display: none; /* Se activa al buscar */
}

.column-card {
  background: #24242b;
  border-radius: 6px;
  padding: 14px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  height: 480px;
}

/* Variaciones de borde sutiles por tipo de relación */
.col-strong { border: 1px solid #f97316; }   /* Naranja competitiva */
.col-weak { border: 1px solid #ef4444; }     /* Rojo debilidad */
.col-synergy { border: 1px solid #22c55e; }  /* Verde combo */

.column-header {
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid #31313c;
}

.col-strong .column-header { color: #fb923c; }
.col-weak .column-header { color: #f87171; }
.col-synergy .column-header { color: #4ade80; }

.cards-list-container {
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  flex-grow: 1;
  padding-right: 4px;
}

/* 🎴 MINI TARJETA INDIVIDUAL DE HÉROE RELACIONADO */
.mini-hero-card {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #1c1c1f;
  border: 1px solid #31313c;
  border-radius: 6px;
  padding: 8px;
  transition: transform 0.1s ease, border-color 0.1s ease;
}

.mini-hero-card:hover {
  transform: translateX(2px);
  border-color: #555;
}

.mini-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid #444452;
}

.mini-info {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.mini-name {
  color: white;
  font-weight: bold;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mini-roles {
  font-size: 10px;
  color: #7b7a8e;
  margin-top: 1px;
}

.empty-column-state {
  font-size: 11px;
  color: #555566;
  text-align: center;
  margin: auto;
}

/* Scrollbars limpios para las columnas */
.cards-list-container::-webkit-scrollbar { width: 4px; }
.cards-list-container::-webkit-scrollbar-track { background: transparent; }
.cards-list-container::-webkit-scrollbar-thumb { background: #444452; border-radius: 2px; }

/* Estado inicial agradable */
.initial-welcome {
  text-align: center;
  padding: 6px 0;
  color: #7b7a8e;
  font-size: 13px;
}
</style>
</head>
<body>

<div class="container">

  <div class="top-bar">
    <div class="logo-text">HoKstats</div>
    <div class="view-tabs">
      <a href="index.html" class="view-tab">General</a>
      <a href="stats.html" class="view-tab">Estadísticas</a>
      <a href="counter.html" class="view-tab active">Counters</a>
      <a href="planner.html" class="view-tab">Planner</a>
      <a href="draft.html" class="view-tab">Draft</a>
      <a href="acerca.html" class="view-tab">Acerca de</a>
    </div>
  </div>

  <table class="main-layout">
    <tr>
      <td class="main-box-cell">
        
        <div class="search-container">
          <div class="search-input-wrapper">
            <input type="text" id="heroSearchInput" placeholder="Escribe el nombre de un héroe para ver sus interacciones..." autocomplete="off">
            <div class="suggestions-list" id="suggestionsBox"></div>
          </div>
        </div>

        <div class="initial-welcome" id="welcome-message">
          🔍 Ingresa un héroe en el buscador para desplegar su ficha técnica analítica de emparejamientos.
        </div>

        <div class="focus-hero-card" id="focus-card">
          <img src="" class="focus-avatar" id="focus-img">
          <div class="focus-details">
            <h2 id="focus-name">Nombre del Héroe</h2>
            <div class="focus-roles" id="focus-roles-zone"></div>
          </div>
        </div>

        <div class="relationships-grid" id="relations-grid">
          
          <div class="column-card col-strong">
            <div class="column-header">⚔️ Es Fuerte Contra</div>
            <div class="cards-list-container" id="strong-list"></div>
          </div>

          <div class="column-card col-weak">
            <div class="column-header">⚠️ Es Débil Contra</div>
            <div class="cards-list-container" id="weak-list"></div>
          </div>

          <div class="column-card col-synergy">
            <div class="column-header">🤝 Excelentes Sinergias</div>
            <div class="cards-list-container" id="synergy-list"></div>
          </div>

        </div>

      </td>
    </tr>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTO4rMY_drrjKMx3KTdjAaSrH6GenxyZ7YzLPT7oiZ_pNYm6EKG-yJPfmbRcZgYGGi2gERA1Gciw-Fy/pub?gid=538223640&single=true&output=csv";

let heroesData = [];

// Extracción directa e inteligente calzada con tu hoja actual
function cargarBaseDatosCSV() {
  Papa.parse(CSV_URL, {
    download: true,
    skipEmptyLines: true,
    complete: function(results) {
      const rows = results.data.slice(1);
      rows.forEach(cols => {
        if (!cols[1]) return;
        
        let fuertesNames = [cols[26], cols[29], cols[32], cols[35], cols[38], cols[41]]
          .filter(Boolean).map(n => n.trim().toLowerCase());
          
        let debilesNames = [cols[44], cols[47], cols[50], cols[53], cols[54], cols[59]]
          .filter(Boolean).map(n => n.trim().toLowerCase());
          
        let sinergiasNames = [cols[11], cols[14], cols[17], cols[20], cols[23]]
          .filter(Boolean).map(n => n.trim().toLowerCase());

        heroesData.push({
          nombre: cols[1].trim(),
          imagen: cols[3] ? cols[3].trim() : "",
          roles: [cols[5], cols[6], cols[7]].filter(Boolean).map(r => r.trim()),
          fuerteContra: fuertesNames, 
          debilContra: debilesNames,
          sinergiaCon: sinergiasNames
        });
      });
      heroesData.sort((a,b) => a.nombre.localeCompare(b.nombre));
    }
  });
}

cargarBaseDatosCSV();

// Lógica de interacción del input buscador
const inputSearch = document.getElementById('heroSearchInput');
const suggestionsBox = document.getElementById('suggestionsBox');

inputSearch.addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase().trim();
  if (!query) {
    suggestionsBox.style.display = 'none';
    return;
  }

  const filtrados = heroesData.filter(h => h.nombre.toLowerCase().includes(query)).slice(0, 6);
  
  if (filtrados.length === 0) {
    suggestionsBox.style.display = 'none';
    return;
  }

  suggestionsBox.innerHTML = '';
  filtrados.forEach(hero => {
    const item = document.createElement('div');
    item.className = 'suggestion-item';
    item.innerHTML = `<img src="${hero.imagen}"> <span>${hero.nombre}</span>`;
    item.addEventListener('click', () => {
      inputSearch.value = hero.nombre;
      suggestionsBox.style.display = 'none';
      desplegarFichaHeroe(hero);
    });
    suggestionsBox.appendChild(item);
  });
  suggestionsBox.style.display = 'block';
});

// Cerrar sugerencias al hacer clic afuera
document.addEventListener('click', (e) => {
  if (e.target !== inputSearch) suggestionsBox.style.display = 'none';
});

// Renderizador del nuevo sistema visual de Tarjetas
function desplegarFichaHeroe(targetHero) {
  document.getElementById('welcome-message').style.display = 'none';
  
  // 1. Configurar Tarjeta de Foco Superior
  document.getElementById('focus-card').style.display = 'flex';
  document.getElementById('focus-img').src = targetHero.imagen;
  document.getElementById('focus-name').innerText = targetHero.nombre;
  
  const rolesZone = document.getElementById('focus-roles-zone');
  rolesZone.innerHTML = '';
  targetHero.roles.forEach(role => {
    rolesZone.innerHTML += `<span class="role-badge">${role}</span>`;
  });

  // Mostrar contenedor de cuadrantes
  document.getElementById('relations-grid').style.display = 'grid';

  const strongList = document.getElementById('strong-list');
  const weakList = document.getElementById('weak-list');
  const synergyList = document.getElementById('synergy-list');

  strongList.innerHTML = '';
  weakList.innerHTML = '';
  synergyList.innerHTML = '';

  const targetNombreLower = targetHero.nombre.toLowerCase();

  // Buscar relaciones bidireccionales cruzando el pool entero
  heroesData.forEach(hero => {
    if (hero.nombre === targetHero.nombre) return; // No compararse consigo mismo
    const loopNombreLower = hero.nombre.toLowerCase();

    // Determinar si Target es FUERTE CONTRA el héroe del loop
    let esFuerte = targetHero.fuerteContra.includes(loopNombreLower) || hero.debilContra.includes(targetNombreLower);
    
    // Determinar si Target es DÉBIL CONTRA el héroe del loop
    let esDebil = targetHero.debilContra.includes(loopNombreLower) || hero.fuerteContra.includes(targetNombreLower);
    
    // Determinar si tienen SINERGIA
    let tieneSinergia = targetHero.sinergiaCon.includes(loopNombreLower) || hero.sinergiaCon.includes(targetNombreLower);

    if (esFuerte) buildingMiniCard(hero, strongList);
    if (esDebil) buildingMiniCard(hero, weakList);
    if (tieneSinergia) buildingMiniCard(hero, synergyList);
  });

  // Mensajes de error en caso de celdas vacías
  if (strongList.children.length === 0) strongList.innerHTML = '<div class="empty-column-state">Sin información directa registrada.</div>';
  if (weakList.children.length === 0) weakList.innerHTML = '<div class="empty-column-state">Sin información directa registrada.</div>';
  if (synergyList.children.length === 0) synergyList.innerHTML = '<div class="empty-column-state">Sin información directa registrada.</div>';
}

function buildingMiniCard(hero, containerElement) {
  const card = document.createElement('div');
  card.className = 'mini-hero-card';
  card.innerHTML = `
    <img src="${hero.imagen}" class="mini-avatar">
    <div class="mini-info">
      <div class="mini-name">${hero.nombre}</div>
      <div class="mini-roles">${hero.roles.join(' / ')}</div>
    </div>
  `;
  // Si haces clic en una mini-tarjeta, ¡puedes navegar directo a la ficha de ese héroe!
  card.addEventListener('click', () => {
    inputSearch.value = hero.nombre;
    desplegarFichaHeroe(hero);
  });
  containerElement.appendChild(card);
}
</script>
</body>
</html>
