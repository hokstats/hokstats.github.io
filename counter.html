<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Counters - HoKstats</title>
<style>
/* 📊 REGLAS GLOBALES COHESIVAS CON HOKSTATS */
body {
  background: #1c1c1f;
  font-family: Arial, sans-serif;
  color: #a0a0b5;
  margin: 0;
  padding: 20px;
  user-select: none;
}

.container {
  max-width: 1100px;
  margin: auto;
}

/* TOP-BAR DE CONTINUIDAD EXTRACCIÓN DIRECTA */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo-text {
  font-family: monospace;
  font-size: 22px;
  color: white;
  margin-bottom: 10px;
  margin-left: 4px;
  letter-spacing: 1px;
}

.view-tabs {
  display: flex;
  gap: 6px;
}

.view-tab {
  padding: 6px 12px;
  font-size: 12px;
  background: #31313c;
  border: 1px solid #444452;
  cursor: pointer;
  color: #a0a0b5;
  text-decoration: none;
}

.view-tab.active {
  background: #4f6edb;
  color: white;
}

/* CONTENEDOR PRINCIPAL TIPO TABLA */
table.main-layout {
  width: 100%;
  border-collapse: collapse;
}

.main-box-cell {
  background: #31313c;
  border-radius: 6px;
  border: 1px solid #1c1c1f;
  padding: 20px;
  box-sizing: border-box;
}

/* 🔍 INTERFAZ DE FILTROS IDÉNTICA A DRAFT / STATS */
.filter-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.tabs { 
  display: flex; 
  border: 1px solid #444452; 
  border-radius: 4px; 
  overflow: hidden; 
}

.tab {
  padding: 6px 12px; 
  cursor: pointer; 
  background: #31313c; 
  font-size: 11px;
  color: #a0a0b5; 
  font-weight: bold; 
  text-transform: uppercase; 
  border-right: 1px solid #444452;
}
.tab:last-child { border-right: none; }
.tab.active { color: white; background: #4f6edb; }

.search-box input {
  width: 180px; 
  padding: 6px 10px; 
  border-radius: 4px; 
  border: 1px solid #444452;
  background: #282830; 
  color: #ccc; 
  font-size: 11px; 
  outline: none;
}

/* 🎴 GRILLA DEL CATÁLOGO (FILA ÚNICA EN 3 COLUMNAS SIMÉTRICAS) */
.catalog-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

/* TARJETA MINIMALISTA PULIDA */
.hero-compact-card {
  background: #24242b;
  border: 1px solid #444452;
  border-radius: 6px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.hero-compact-card:hover {
  border-color: #4f6edb;
  background: #292932;
}

.card-left-block {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.card-avatar {
  width: 44px;
  height: 44px;
  border-radius: 4px;
  object-fit: cover;
  border: 1px solid #444452;
}

.card-meta-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.card-hero-name {
  color: white;
  font-weight: bold;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-stats-row {
  display: flex;
  gap: 10px;
  font-size: 11px;
  color: #7b7a8e;
}

/* CONTENEDOR DE TIER MINIMALISTA DERECHO */
.card-tier-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  min-width: 40px;
  text-align: center;
}

.tier-bg-text {
  font-size: 9px;
  font-weight: bold;
  color: rgba(255, 255, 255, 0.08);
  letter-spacing: 0.5px;
  position: absolute;
  top: 2px;
  text-transform: uppercase;
}

.tier-letter {
  font-size: 18px;
  font-weight: 900;
  color: white;
  margin-top: 8px;
  z-index: 2;
}

/* 🎚️ CONFIGURACIÓN DE VISTA DETALLADA */
.detail-view-container {
  display: none;
}

.back-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.btn-back {
  background: #24242b;
  border: 1px solid #444452;
  color: white;
  padding: 6px 14px;
  font-size: 11px;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
}
.btn-back:hover { background: #31313c; border-color: #7b7a8e; }

/* Botón de Modo Bidireccional Analítico */
.btn-toggle-mode {
  background: #31313c;
  border: 1px solid #444452;
  color: #a0a0b5;
  padding: 6px 12px;
  font-size: 11px;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
}
.btn-toggle-mode.active {
  background: #eab308;
  color: #1c1c1f;
  border-color: #facc15;
}

.focus-hero-card {
  background: #24242b;
  border: 1px solid #444452;
  border-radius: 6px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 20px;
}

.focus-avatar {
  width: 55px;
  height: 55px;
  border-radius: 4px;
  object-fit: cover;
  border: 2px solid #4f6edb;
}

.focus-details h2 { margin: 0; color: white; font-size: 16px; }
.focus-roles { display: flex; gap: 6px; margin-top: 4px; }
.role-badge {
  background: #31313c; color: #a0a0b5; font-size: 10px; padding: 2px 6px; border-radius: 4px; border: 1px solid #444452; text-transform: uppercase;
}

/* REJILLA DE RELACIONES */
.relationships-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.column-card {
  background: #24242b;
  border-radius: 6px;
  padding: 12px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  height: 440px;
}

.col-strong { border: 1px solid #dc2626; }
.col-weak { border: 1px solid #ef4444; opacity: 0.95; }
.col-synergy { border: 1px solid #22c55e; }

.column-header {
  font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid #31313c;
}
.col-strong .column-header { color: #f87171; }
.col-weak .column-header { color: #f87171; }
.col-synergy .column-header { color: #4ade80; }

.cards-list-container {
  display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex-grow: 1; padding-right: 2px;
}

.mini-hero-card {
  display: flex; align-items: center; gap: 10px; background: #1c1c1f; border: 1px solid #31313c; border-radius: 4px; padding: 6px; cursor: pointer;
}
.mini-hero-card:hover { border-color: #555; }
.mini-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
.mini-name { color: white; font-weight: bold; font-size: 12px; }
.mini-roles { font-size: 10px; color: #7b7a8e; }

.empty-column-state { font-size: 11px; color: #555566; text-align: center; margin: auto; }
.cards-list-container::-webkit-scrollbar { width: 4px; }
.cards-list-container::-webkit-scrollbar-thumb { background: #444452; border-radius: 2px; }
</style>
</head>
<body>

<div class="container">

  <div class="top-bar">
    <div class="logo-text">HoKstats</div>
    <div class="view-tabs">
      <a href="index.html" class="view-tab">General</a>
      <a href="stats.html" class="view-tab">Estadísticas</a>
      <a href="counter.html" class="view-tab active">Counters</a>
      <a href="planner.html" class="view-tab">Planner</a>
      <a href="draft.html" class="view-tab">Draft</a>
      <a href="acerca.html" class="view-tab">Acerca de</a>
    </div>
  </div>

  <table class="main-layout">
    <tr>
      <td class="main-box-cell">
        
        <div id="catalog-view">
          <div class="filter-header-row">
            <div class="tabs">
              <div class="tab active" data-role="all">Todo</div>
              <div class="tab" data-role="Choque">Choque</div>
              <div class="tab" data-role="Cazador">Cazador</div>
              <div class="tab" data-role="Medio">Medio</div>
              <div class="tab" data-role="Merodeo">Merodeo</div>
              <div class="tab" data-role="Farmeo">Farmeo</div>
            </div>
            <div class="search-box">
              <input type="text" id="catalogSearch" placeholder="Buscar héroe por nombre...">
            </div>
          </div>

          <div class="catalog-grid" id="catalogGridZone"></div>
        </div>

        <div id="detail-view" class="detail-view-container">
          <div class="back-bar">
            <button class="btn-back" onclick="volverAlCatalogo()">⬅️ Volver al Catálogo</button>
            <button class="btn-toggle-mode" id="toggleAnalysisMode" onclick="cambiarModoAnalisis()">Modo Cruzado: OFF</button>
          </div>

          <div class="focus-hero-card">
            <img src="" class="focus-avatar" id="focus-img">
            <div class="focus-details">
              <h2 id="focus-name">-</h2>
              <div class="focus-roles" id="focus-roles-zone"></div>
            </div>
          </div>

          <div class="relationships-grid">
            <div class="column-card col-strong">
              <div class="column-header">⚔️ Es Fuerte Contra</div>
              <div class="cards-list-container" id="strong-list"></div>
            </div>

            <div class="column-card col-weak">
              <div class="column-header">⚠️ Es Débil Contra</div>
              <div class="cards-list-container" id="weak-list"></div>
            </div>

            <div class="column-card col-synergy">
              <div class="column-header">🤝 Excelentes Sinergias</div>
              <div class="cards-list-container" id="synergy-list"></div>
            </div>
          </div>
        </div>

      </td>
    </tr>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTO4rMY_drrjKMx3KTdjAaSrH6GenxyZ7YzLPT7oiZ_pNYm6EKG-yJPfmbRcZgYGGi2gERA1Gciw-Fy/pub?gid=538223640&single=true&output=csv";

let heroesData = [];
let currentRoleFilter = 'all';
let currentSearchQuery = '';
let selectedHeroInFocus = null;
let bidireccionalMode = false; // Por defecto: Unidireccional (Limpio)

// Asignación de color según rango de Winrate dinámico
function obtenerColorWinrate(wrString) {
  let num = parseFloat(wrString.replace('%', ''));
  if (isNaN(num)) return '#a0a0b5';
  if (num >= 53) return '#4ade80'; // Máximo meta
  if (num >= 51) return '#10b981'; // Fuerte estable
  if (num >= 49) return '#a0a0b5'; // Equilibrado
  if (num >= 47) return '#f97316'; // Bajo
  return '#f87171'; // Crítico / Peor
}

function cargarBaseDatos() {
  Papa.parse(CSV_URL, {
    download: true,
    skipEmptyLines: true,
    complete: function(results) {
      const rows = results.data.slice(1);
      rows.forEach(cols => {
        if (!cols[1]) return;
        
        let fuertesNames = [cols[26], cols[29], cols[32], cols[35], cols[38], cols[41]]
          .filter(Boolean).map(n => n.trim().toLowerCase());
          
        let debilesNames = [cols[44], cols[47], cols[50], cols[53], cols[54], cols[59]]
          .filter(Boolean).map(n => n.trim().toLowerCase());
          
        let sinergiasNames = [cols[11], cols[14], cols[17], cols[20], cols[23]]
          .filter(Boolean).map(n => n.trim().toLowerCase());

        heroesData.push({
          nombre: cols[1].trim(),
          imagen: cols[3] ? cols[3].trim() : "",
          roles: [cols[5], cols[6], cols[7]].filter(Boolean).map(r => r.trim()),
          winrate: cols[8] ? cols[8].trim() : "0%",
          pickrate: cols[9] ? cols[9].trim() : "0%",
          banrate: cols[10] ? cols[10].trim() : "0%",
          tier: cols[4] ? cols[4].trim().toUpperCase() : "T3", // Extraído posicional de stats
          fuerteContra: fuertesNames, 
          debilContra: debilesNames,
          sinergiaCon: sinergiasNames
        });
      });
      heroesData.sort((a,b) => a.nombre.localeCompare(b.nombre));
      renderCatalogo();
    }
  });
}

function renderCatalogo() {
  const grid = document.getElementById('catalogGridZone');
  grid.innerHTML = '';

  heroesData.forEach(hero => {
    if (currentRoleFilter !== 'all' && !hero.roles.includes(currentRoleFilter)) return;
    if (currentSearchQuery && !hero.nombre.toLowerCase().includes(currentSearchQuery)) return;

    const wrColor = obtenerColorWinrate(hero.winrate);

    const card = document.createElement('div');
    card.className = 'hero-compact-card';
    card.innerHTML = `
      <div class="card-left-block">
        <img src="${hero.imagen}" class="card-avatar">
        <div class="card-meta-info">
          <div class="card-hero-name">${hero.nombre}</div>
          <div class="card-stats-row">
            <div class="stat-wr">WR: <span style="color: ${wrColor}; font-weight: bold;">${hero.winrate}</span></div>
            <div>PR: <span style="color: #ccc;">${hero.pickrate}</span></div>
            <div>BR: <span style="color: #ccc;">${hero.banrate}</span></div>
          </div>
        </div>
      </div>
      <div class="card-tier-block">
        <div class="tier-bg-text">tier</div>
        <div class="tier-letter">${hero.tier}</div>
      </div>
    `;

    card.addEventListener('click', () => {
      desplegarFichaDetalle(hero);
    });

    grid.appendChild(card);
  });
}

function desplegarFichaDetalle(targetHero) {
  selectedHeroInFocus = targetHero;
  document.getElementById('catalog-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';

  document.getElementById('focus-img').src = targetHero.imagen;
  document.getElementById('focus-name').innerText = targetHero.nombre;
  
  const rolesZone = document.getElementById('focus-roles-zone');
  rolesZone.innerHTML = '';
  targetHero.roles.forEach(role => {
    rolesZone.innerHTML += `<span class="role-badge">${role}</span>`;
  });

  procesarRelacionesColumnas();
}

function procesarRelacionesColumnas() {
  if (!selectedHeroInFocus) return;

  const strongList = document.getElementById('strong-list');
  const weakList = document.getElementById('weak-list');
  const synergyList = document.getElementById('synergy-list');

  strongList.innerHTML = '';
  weakList.innerHTML = '';
  synergyList.innerHTML = '';

  const targetNombreLower = selectedHeroInFocus.nombre.toLowerCase();

  heroesData.forEach(hero => {
    if (hero.nombre === selectedHeroInFocus.nombre) return;
    const loopNombreLower = hero.nombre.toLowerCase();

    // Filtros de relación estricta (Unidireccional vs Cruzado completo)
    let esFuerte = selectedHeroInFocus.fuerteContra.includes(loopNombreLower);
    let esDebil = selectedHeroInFocus.debilContra.includes(loopNombreLower);
    let tieneSinergia = selectedHeroInFocus.sinergiaCon.includes(loopNombreLower);

    if (bidireccionalMode) {
      if (hero.debilContra.includes(targetNombreLower)) esFuerte = true;
      if (hero.fuerteContra.includes(targetNombreLower)) esDebil = true;
      if (hero.sinergiaCon.includes(targetNombreLower)) tieneSinergia = true;
    }

    if (esFuerte) crearMiniTarjetaRelacion(hero, strongList);
    if (esDebil) crearMiniTarjetaRelacion(hero, weakList);
    if (tieneSinergia) crearMiniTarjetaRelacion(hero, synergyList);
  });

  if (strongList.children.length === 0) strongList.innerHTML = '<div class="empty-column-state">Sin registros directos.</div>';
  if (weakList.children.length === 0) weakList.innerHTML = '<div class="empty-column-state">Sin registros directos.</div>';
  if (synergyList.children.length === 0) synergyList.innerHTML = '<div class="empty-column-state">Sin registros directos.</div>';
}

function cambiarModoAnalisis() {
  bidireccionalMode = !bidireccionalMode;
  const btn = document.getElementById('toggleAnalysisMode');
  if (bidireccionalMode) {
    btn.innerText = "Modo Cruzado: ON";
    btn.classList.add('active');
  } else {
    btn.innerText = "Modo Cruzado: OFF";
    btn.classList.remove('active');
  }
  procesarRelacionesColumnas();
}

function crearMiniTarjetaRelacion(hero, contenedor) {
  const mini = document.createElement('div');
  mini.className = 'mini-hero-card';
  mini.innerHTML = `
    <img src="${hero.imagen}" class="mini-avatar">
    <div>
      <div class="mini-name">${hero.nombre}</div>
      <div class="mini-roles">${hero.roles.join(' / ')}</div>
    </div>
  `;
  mini.addEventListener('click', () => {
    desplegarFichaDetalle(hero);
  });
  contenedor.appendChild(mini);
}

function volverAlCatalogo() {
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('catalog-view').style.display = 'block';
}

// CAPTURA DE EVENTOS
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentRoleFilter = tab.dataset.role;
    renderCatalogo();
  });
});

document.getElementById('catalogSearch').addEventListener('input', (e) => {
  currentSearchQuery = e.target.value.toLowerCase().trim();
  renderCatalogo();
});

cargarBaseDatos();
</script>
</body>
</html>
