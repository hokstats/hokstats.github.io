<!DOCTYPE html>
<html lang="es" style="scrollbar-gutter: stable;">
<head>
<meta charset="UTF-8">
<title>Map Planner - HoKstats</title>

<style>
/* 📊 IDENTIDAD GLOBAL UNIFICADA Y CONTROL DE LAYOUT SHIFT */
* {
  box-sizing: border-box;
}

body {
  background: #1c1c1f;
  font-family: Arial, sans-serif;
  color: #a0a0b5;
  margin: 0;
  padding: 24px 0; /* Relleno superior/inferior idéntico */
  user-select: none;
}

/* MARCO MAESTRO: Bloquea los límites horizontales milimétricamente en todo el sitio */
.container {
  width: 100%;
  max-width: 1160px; /* 1100px útiles + 60px de padding total acumulado */
  margin: 0 auto;
  padding: 0 30px;
}

/* BARRA SUPERIOR ESTATICA */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: flex-end; /* Alineación perfecta al piso de la pestaña */
  margin-bottom: 20px;
  padding: 0 4px;
}

.logo-text {
  font-family: monospace;
  font-size: 22px;
  color: white;
  margin: 0;
  letter-spacing: 1px;
  line-height: 1;
}

.view-tabs {
  display: flex;
  gap: 6px;
}

.view-tab {
  padding: 6px 12px;
  font-size: 12px;
  background: #31313c;
  border: 1px solid #444452;
  cursor: pointer;
  color: #a0a0b5;
  text-decoration: none;
  white-space: nowrap;
  line-height: 1.2;
}

.view-tab.active {
  background: #4f6edb;
  color: white;
  border-color: #4f6edb;
}

/* 📦 CAJA MAESTRA UNIVERSAL (REPLICA EXACTA EN TODAS LAS PÁGINAS) */
.main-box {
  background: #31313c;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid #444452; /* Borde unificado de alta visibilidad */
  width: 100%;
}

/* CONTENEDOR INTERNO PARA DAR CONTINUIDAD AL ANCHO DE CONTENIDO */
.content-padding-zone {
  padding: 40px 30px 40px 30px; /* Relleno lateral idéntico de 30px */
}

/* 🗺️ INTERFAZ ESTRUCTURAL DEL PLANNER */
.planner-workspace {
  display: flex;
  gap: 20px;
  align-items: flex-start;
}

/* ÁREA DEL MAPA (CANVAS INTERACTIVO) */
.map-canvas-container {
  flex: 0 0 540px;
  width: 540px;
  height: 540px;
  background: #1a1a20;
  border: 1px solid #444452;
  border-radius: 6px;
  position: relative;
  overflow: hidden;
}

.map-bg-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  opacity: 0.75;
}

/* CAPAS INTERACTIVAS SOBRE EL MAPA */
.placed-node {
  position: absolute;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  cursor: move;
  z-index: 10;
  box-shadow: 0 2px 6px rgba(0,0,0,0.6);
  border: 2px solid white;
}

.placed-node.bando-azul { border-color: #4f6edb; box-shadow: 0 0 8px #4f6edb; }
.placed-node.bando-rojo { border-color: #ef4444; box-shadow: 0 0 8px #ef4444; }

.bin-zone {
  position: absolute;
  bottom: 12px;
  right: 12px;
  width: 44px;
  height: 44px;
  background: rgba(28, 28, 31, 0.85);
  border: 1px dashed #ef4444;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  z-index: 5;
  transition: all 0.2s;
}
.bin-zone.drag-over {
  background: #ef4444;
  transform: scale(1.1);
  font-size: 22px;
}

/* PANEL LATERAL DE CONTROL Y HÉROES */
.control-sidebar-panel {
  flex: 1;
  background: #24242b;
  border: 1px solid #444452;
  border-radius: 6px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  height: 540px; /* Sincronizado simétricamente con el mapa */
  box-sizing: border-box;
}

.sidebar-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.sidebar-title {
  color: white;
  font-size: 14px;
  font-weight: bold;
  margin: 0;
}

.btn-export-png {
  background: #4f6edb;
  border: 1px solid #4f6edb;
  color: white;
  padding: 6px 14px;
  font-size: 11px;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
}
.btn-export-png:hover { background: #3b55b8; }
.btn-export-png:disabled { background: #31313c; border-color: #444452; color: #7b7a8e; cursor: not-allowed; }

/* PANEL DE FILTROS DEL DRAWER (MIMETIZADO CON STATS Y COUNTERS) */
.drawer-filters-container {
  margin-bottom: 12px;
}
.tabs-wrapper {
  display: flex;
  gap: 8px;
  align-items: center;
  width: 100%;
}
.tabs {
  display: flex;
  flex: 1;
  border: 1px solid #444452;
  border-radius: 4px;
  overflow: hidden;
}
.tab {
  flex: 1;
  text-align: center;
  padding: 6px 4px;
  cursor: pointer;
  background: #31313c;
  font-size: 10.5px;
  font-weight: 500;
  color: #a0a0b5;
  border: none;
  border-right: 1px solid #444452;
  outline: none;
}
.tab:last-child { border-right: none; }
.tab.active { color: white; background: #4f6edb; }

.search-box {
  width: 130px;
  flex: 0 0 130px;
}
.search-box input {
  width: 100%;
  padding: 5.5px 8px;
  border-radius: 4px;
  border: 1px solid #444452;
  background: #1c1c1f;
  color: white;
  font-size: 11px;
  outline: none;
}

/* OPCIONES DE BANDO (AZUL / ROJO) */
.team-selector-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.radio-tile-label {
  flex: 1;
  background: #31313c;
  border: 1px solid #444452;
  border-radius: 4px;
  padding: 6px;
  text-align: center;
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
  color: #a0a0b5;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
input[type="radio"] { display: none; }
input[type="radio"]:checked + .radio-tile-label.side-blue { background: rgba(79, 110, 219, 0.2); border-color: #4f6edb; color: #748ffc; }
input[type="radio"]:checked + .radio-tile-label.side-red { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #ff8787; }

/* REJILLA INTERNA DE ICONOS EN EL DRAWER */
.drawer-scrollable-grid {
  flex: 1;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  padding-right: 4px;
  background: #1c1c1f;
  border: 1px solid #444452;
  border-radius: 4px;
  padding: 10px;
}

.drawer-hero-node {
  aspect-ratio: 1;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid #444452;
  cursor: grab;
  position: relative;
  background: #24242b;
  transition: transform 0.15s;
}
.drawer-hero-node:hover { transform: scale(1.05); border-color: #7b7a8e; }
.drawer-hero-node img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* scrollbar modo oscuro */
::-webkit-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: #1c1c1f; }
::-webkit-scrollbar-thumb { background: #444452; border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: #5a5a6b; }

.drawer-scrollable-grid::-webkit-scrollbar { width: 4px; }
.drawer-scrollable-grid::-webkit-scrollbar-thumb { background: #444452; border-radius: 2px; }
</style>
</head>

<body>

<div class="container">

  <div class="top-bar">
    <div class="logo-text">HoKstats</div>
    <div class="view-tabs">
      <a href="index.html" class="view-tab">General</a>
      <a href="stats.html" class="view-tab">Estadísticas</a>
      <a href="counter.html" class="view-tab">Counters</a>
      <a href="planner.html" class="view-tab active">Planner</a>
      <a href="draft.html" class="view-tab">Draft</a>
      <a href="acerca.html" class="view-tab">Acerca de</a>
    </div>
  </div>

  <div class="main-box">
    <div class="content-padding-zone">
      
      <div class="planner-workspace">
        
        <div class="map-canvas-container" id="mapZone">
          <img src="https://r2.community.honorofkings.com/content/171569426367809631.JPEG" class="map-bg-image" draggable="false">
          
          <div class="bin-zone" id="binZone">🗑️</div>
        </div>

        <div class="control-sidebar-panel">
          
          <div class="sidebar-header-row">
            <h3 class="sidebar-title">Elementos Tácticos</h3>
            <button class="btn-export-png" id="btnExport">💾 Guardar PNG</button>
          </div>

          <div class="team-selector-bar">
            <div style="flex:1;">
              <input type="radio" name="bando" id="bandoAzul" value="azul" checked>
              <label for="bandoAzul" class="radio-tile-label side-blue">🔵 Bando Azul</label>
            </div>
            <div style="flex:1;">
              <input type="radio" name="bando" id="bandoRojo" value="rojo">
              <label for="bandoRojo" class="radio-tile-label side-red">🔴 Bando Rojo</label>
            </div>
          </div>

          <div class="drawer-filters-container">
            <div class="tabs-wrapper">
              <div class="tabs">
                <button class="tab active" data-role="all">Todo</button>
                <button class="tab" data-role="Choque">Choque</button>
                <button class="tab" data-role="Cazador">Cazador</button>
                <button class="tab" data-role="Medio">Medio</button>
                <button class="tab" data-role="Merodeo">Merodeo</button>
                <button class="tab" data-role="Farmeo">Farmeo</button>
              </div>
              <div class="search-box">
                <input type="text" id="drawerSearch" placeholder="Buscar...">
              </div>
            </div>
          </div>

          <div class="drawer-scrollable-grid" id="heroesDrawerZone"></div>

        </div>

      </div>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTO4rMY_drrjKMx3KTdjAaSrH6GenxyZ7YzLPT7oiZ_pNYm6EKG-yJPfmbRcZgYGGi2gERA1Gciw-Fy/pub?gid=538223640&single=true&output=csv";

let heroesCatalog = [];
let activeDraggedSrc = null;

// Inicialización de base de datos analítica
Papa.parse(CSV_URL, {
  download: true,
  skipEmptyLines: true,
  complete: function(results) {
    const rows = results.data.slice(1);
    rows.forEach(cols => {
      if (!cols[1]) return;
      heroesCatalog.push({
        nombre: cols[1].trim(),
        imagen: cols[3] ? cols[3].trim() : "",
        roles: [cols[5], cols[6], cols[7]].filter(Boolean).map(r => r.trim())
      });
    });
    heroesCatalog.sort((a,b) => a.nombre.localeCompare(b.nombre));
    renderDrawer('all', '');
  }
});

function renderDrawer(role, query) {
  const zone = document.getElementById('heroesDrawerZone');
  zone.innerHTML = '';

  heroesCatalog.forEach(hero => {
    if (role !== 'all' && !hero.roles.includes(role)) return;
    if (query && !hero.nombre.toLowerCase().includes(query)) return;

    const node = document.createElement('div');
    node.className = 'drawer-hero-node';
    node.setAttribute('draggable', 'true');
    node.innerHTML = `<img src="${hero.imagen}" title="${hero.nombre}" crossorigin="anonymous">`;

    node.addEventListener('dragstart', (e) => {
      activeDraggedSrc = hero.imagen;
      e.dataTransfer.setData('text/plain', hero.imagen);
    });

    zone.appendChild(node);
  });
}

// Configuración del contenedor interactivo del mapa (Drop Zone Principal)
const mapZone = document.getElementById('mapZone');
const binZone = document.getElementById('binZone');

mapZone.addEventListener('dragover', (e) => { e.preventDefault(); });

mapZone.addEventListener('drop', (e) => {
  e.preventDefault();
  if (!activeDraggedSrc) return;

  // Evita calcular si el drop cae directamente sobre un nodo ya existente
  if (e.target.classList.contains('placed-node')) return;

  const rect = mapZone.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const bandoActivo = document.querySelector('input[name="bando"]:checked').value;
  crearNodoEnMapa(activeDraggedSrc, x, y, bandoActivo);
  activeDraggedSrc = null;
});

function crearNodoEnMapa(src, x, y, bando) {
  const imgNode = document.createElement('img');
  imgNode.src = src;
  imgNode.className = `placed-node bando-${bando}`;
  imgNode.style.left = `${x}px`;
  imgNode.style.top = `${y}px`;
  imgNode.setAttribute('draggable', 'true');
  imgNode.setAttribute('crossorigin', 'anonymous');

  // Lógica de arrastre interno (Drag & Move / Trash out)
  imgNode.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', 'internal-move');
    setTimeout(() => { imgNode.style.display = 'none'; }, 0);
    
    // Almacena referencia global temporal del nodo activo para recolocación
    window.currentMovingNode = imgNode;
  });

  imgNode.addEventListener('dragend', (e) => {
    binZone.classList.remove('drag-over');
    if (window.currentMovingNode) {
      window.currentMovingNode.style.display = 'block';
      window.currentMovingNode = null;
    }
  });

  mapZone.appendChild(imgNode);
}

// Controladores de la zona de reciclaje (Trash Bin)
binZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  binZone.classList.add('drag-over');
});

binZone.addEventListener('dragleave', () => {
  binZone.classList.remove('drag-over');
});

binZone.addEventListener('drop', (e) => {
  e.preventDefault();
  e.stopPropagation(); // Evita que el contenedor del mapa procese la recolocación

  if (window.currentMovingNode) {
    window.currentMovingNode.remove();
    window.currentMovingNode = null;
  }
  binZone.classList.remove('drag-over');
});

// Manejo de recolocación de nodos existentes dentro del mapa
mapZone.addEventListener('dragover', (e) => { e.preventDefault(); });
mapZone.addEventListener('drop', (e) => {
  if (window.currentMovingNode && e.target === mapZone) {
    const rect = mapZone.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    window.currentMovingNode.style.left = `${x}px`;
    window.currentMovingNode.style.top = `${y}px`;
    window.currentMovingNode.style.display = 'block';
    window.currentMovingNode = null;
  }
});

// Mecánica de exportación táctica en Alta Fidelidad (Renderizado HD Crisp)
document.getElementById('btnExport').addEventListener('click', () => {
  const btn = document.getElementById('btnExport');
  btn.innerText = "⏳ Procesando...";
  btn.disabled = true;

  html2canvas(mapZone, {
    useCORS: true,
    allowTaint: false,
    scale: 2, // Escala duplicada para preservar nitidez 4K
    backgroundColor: null
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'hokstats-estrategia.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    btn.innerText = "💾 Guardar PNG";
    btn.disabled = false;
  }).catch(err => {
    console.error("Error exportando el canvas:", err);
    alert("Hubo un problema al generar la imagen.");
    btn.innerText = "💾 Guardar PNG";
    btn.disabled = false;
  });
});

// Controladores de filtros e inputs integrados
let currentRole = 'all';
let currentSearch = '';

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentRole = tab.dataset.role;
    renderDrawer(currentRole, currentSearch);
  });
});

document.getElementById('drawerSearch').addEventListener('input', (e) => {
  currentSearch = e.target.value.toLowerCase().trim();
  renderDrawer(currentRole, currentSearch);
});
</script>

</body>
</html>
