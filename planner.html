<!DOCTYPE html>
<html lang="es" style="scrollbar-gutter: stable;">
<head>
<meta charset="UTF-8">
<title>Map Planner - HoKstats</title>

<style>
/* 📊 IDENTIDAD GLOBAL UNIFICADA Y CONTROL DE LAYOUT SHIFT */
* {
  box-sizing: border-box;
}

body {
  background: #1c1c1f;
  font-family: Arial, sans-serif;
  color: #a0a0b5;
  margin: 0;
  padding: 24px 0; /* Relleno superior/inferior idéntico */
  user-select: none;
}

/* MARCO MAESTRO: Bloquea los límites horizontales milimétricamente en todo el sitio */
.container {
  width: 100%;
  max-width: 1160px; /* 1100px útiles + 60px de padding total acumulado */
  margin: 0 auto;
  padding: 0 30px;
}

/* BARRA SUPERIOR ESTATICA */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: flex-end; /* Alineación perfecta al piso de la pestaña */
  margin-bottom: 20px;
  padding: 0 4px;
}

.logo-text {
  font-family: monospace;
  font-size: 22px;
  color: white;
  margin: 0;
  letter-spacing: 1px;
  line-height: 1;
}

.view-tabs {
  display: flex;
  gap: 6px;
}

.view-tab {
  padding: 6px 12px;
  font-size: 12px;
  background: #31313c;
  border: 1px solid #444452;
  cursor: pointer;
  color: #a0a0b5;
  text-decoration: none;
  white-space: nowrap;
  line-height: 1.2;
}

.view-tab.active {
  background: #4f6edb;
  color: white;
  border-color: #4f6edb;
}

/* 📦 CAJA MAESTRA UNIVERSAL (REPLICA EXACTA EN TODAS LAS PÁGINAS) */
.main-box {
  background: #31313c;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid #444452; /* Borde unificado */
  width: 100%;
}

/* CONTENEDOR INTERNO PARA DAR CONTINUIDAD AL ANCHO DE CONTENIDO */
.content-padding-zone {
  padding: 40px 30px 40px 30px; /* Relleno lateral idéntico de 30px */
}

/* 🔥 ESTRUCTURA INTERNA PRESENCIAL DEL PLANNER ORIGINAL */
.planner-layout {
  display: flex;
  gap: 20px;
}

/* 🗺️ AREA DEL MAPA CONSERVADA */
.map-container {
  position: relative;
  width: 540px;
  height: 540px;
  background: #24242b;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid #1c1c1f;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.map-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  user-select: none;
  -webkit-user-drag: none;
}

/* 📌 ELEMENTOS INTERNOS DEL MAPA (NODOS DINÁMICOS) */
.map-node {
  position: absolute;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  cursor: grab;
  z-index: 10;
  box-shadow: 0 2px 5px rgba(0,0,0,0.5);
  transition: transform 0.1s ease;
}

.map-node:active {
  cursor: grabbing;
  transform: translate(-50%, -50%) scale(1.1);
  z-index: 20;
}

.map-node.azul { border: 2px solid #4f6edb; }
.map-node.rojo { border: 2px solid #ef4444; }

/* 🗑️ PAPELERA DINÁMICA ORIGINAL */
.trash-bin {
  position: absolute;
  bottom: 15px;
  right: 15px;
  width: 44px;
  height: 44px;
  background: rgba(28, 28, 31, 0.85);
  border: 1px dashed #ef4444;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  z-index: 5;
  transition: all 0.2s ease;
}

.trash-bin.drag-over {
  background: #ef4444;
  transform: scale(1.1);
}

/* 🎚️ CAJÓN / SIDEBAR ORIGINAL INTEGRAL */
.drawer {
  flex: 1;
  background: #24242b;
  border-radius: 6px;
  border: 1px solid #1c1c1f;
  padding: 15px;
  display: flex;
  flex-direction: column;
  height: 540px; /* Alineado al mapa perfectamente */
}

.drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.drawer-title {
  color: white;
  font-size: 14px;
  font-weight: bold;
}

.btn-download {
  background: #4f6edb;
  border: none;
  color: white;
  padding: 6px 12px;
  font-size: 11px;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
}

.btn-download:hover {
  background: #3b55b8;
}

/* CONTENEDOR DE SELECCIÓN DE BANDO */
.side-selector {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.side-option {
  flex: 1;
}

.side-option input[type="radio"] {
  display: none;
}

.side-label {
  display: block;
  text-align: center;
  padding: 8px;
  background: #31313c;
  border: 1px solid #444452;
  border-radius: 4px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  color: #a0a0b5;
}

.side-option input[type="radio"]:checked + .side-label.blue-side {
  background: rgba(79, 110, 219, 0.15);
  border-color: #4f6edb;
  color: #748ffc;
}

.side-option input[type="radio"]:checked + .side-label.red-side {
  background: rgba(239, 68, 68, 0.15);
  border-color: #ef4444;
  color: #ff8787;
}

/* FILTROS INTERNOS DEL SIDEBAR ORIGINAL */
.filter-row {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
  align-items: center;
}

.role-tabs {
  display: flex;
  flex: 1;
  border: 1px solid #444452;
  border-radius: 4px;
  overflow: hidden;
}

.role-tab {
  flex: 1;
  text-align: center;
  padding: 6px 2px;
  background: #31313c;
  font-size: 11px;
  color: #a0a0b5;
  cursor: pointer;
  border: none;
  border-right: 1px solid #444452;
  outline: none;
}

.role-tab:last-child {
  border-right: none;
}

.role-tab.active {
  background: #4f6edb;
  color: white;
}

.search-field {
  width: 140px;
}

.search-field input {
  width: 100%;
  padding: 6px 10px;
  background: #1c1c1f;
  border: 1px solid #444452;
  border-radius: 4px;
  color: white;
  font-size: 11px;
  outline: none;
}

/* CUADRÍCULA DE SELECCIÓN DE HÉROES */
.heroes-pool {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  overflow-y: auto;
  background: #1c1c1f;
  border: 1px solid #444452;
  border-radius: 4px;
  padding: 10px;
}

.pool-item {
  aspect-ratio: 1;
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid #444452;
  cursor: grab;
  background: #31313c;
}

.pool-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* SCROLLBAR INTERNO DEL POOL */
.heroes-pool::-webkit-scrollbar {
  width: 4px;
}

.heroes-pool::-webkit-scrollbar-thumb {
  background: #444452;
  border-radius: 2px;
}

/* scrollbar general modo oscuro */
::-webkit-scrollbar {
  width: 10px;
}
::-webkit-scrollbar-track {
  background: #1c1c1f;
}
::-webkit-scrollbar-thumb {
  background: #444452;
  border-radius: 6px;
}
::-webkit-scrollbar-thumb:hover {
  background: #5a5a6b;
}
</style>
</head>

<body>

<div class="container">

  <div class="top-bar">
    <div class="logo-text">HoKstats</div>
    <div class="view-tabs">
      <a href="index.html" class="view-tab">General</a>
      <a href="stats.html" class="view-tab">Estadísticas</a>
      <a href="counter.html" class="view-tab">Counters</a>
      <a href="planner.html" class="view-tab active">Planner</a>
      <a href="draft.html" class="view-tab">Draft</a>
      <a href="acerca.html" class="view-tab">Acerca de</a>
    </div>
  </div>

  <div class="main-box">
    <div class="content-padding-zone">

      <div class="planner-layout">
        
        <div class="map-container" id="mapZone">
          <img src="https://r2.community.honorofkings.com/content/171569426367809631.JPEG" draggable="false" crossorigin="anonymous">
          <div class="trash-bin" id="trashBin">🗑️</div>
        </div>

        <div class="drawer">
          <div class="drawer-header">
            <span class="drawer-title">Elementos Tácticos</span>
            <button class="btn-download" id="btnExport">💾 Guardar PNG</button>
          </div>

          <div class="side-selector">
            <div class="side-option">
              <input type="radio" name="sideGroup" id="sideBlue" value="azul" checked>
              <label for="sideBlue" class="side-label blue-side">🔵 Bando Azul</label>
            </div>
            <div class="side-option">
              <input type="radio" name="sideGroup" id="sideRed" value="rojo">
              <label for="sideRed" class="side-label red-side">🔴 Bando Rojo</label>
            </div>
          </div>

          <div class="filter-row">
            <div class="role-tabs">
              <button class="role-tab active" data-role="all">Todo</button>
              <button class="role-tab" data-role="Choque">Choque</button>
              <button class="role-tab" data-role="Cazador">Cazador</button>
              <button class="role-tab" data-role="Medio">Medio</button>
              <button class="role-tab" data-role="Merodeo">Merodeo</button>
              <button class="role-tab" data-role="Farmeo">Farmeo</button>
            </div>
            <div class="search-field">
              <input type="text" id="heroSearch" placeholder="Buscar...">
            </div>
          </div>

          <div class="heroes-pool" id="heroesPoolZone"></div>
        </div>

      </div>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
// 🚨 LÓGICA DE PROGRAMACIÓN 100% INTACTA - CONSERVADA LÍNEA POR LÍNEA DEL PLANNER ORIGINAL
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTO4rMY_drrjKMx3KTdjAaSrH6GenxyZ7YzLPT7oiZ_pNYm6EKG-yJPfmbRcZgYGGi2gERA1Gciw-Fy/pub?gid=538223640&single=true&output=csv";

let catalogData = [];
let draggingSrc = null;
let activeNode = null;

// Carga e inicialización analítica mediante PapaParse
Papa.parse(CSV_URL, {
  download: true,
  skipEmptyLines: true,
  complete: function(results) {
    const rows = results.data.slice(1);
    rows.forEach(cols => {
      if (!cols[1]) return;
      catalogData.push({
        nombre: cols[1].trim(),
        imagen: cols[3] ? cols[3].trim() : "",
        roles: [cols[5], cols[6], cols[7]].filter(Boolean).map(r => r.trim())
      });
    });
    catalogData.sort((a,b) => a.nombre.localeCompare(b.nombre));
    renderPool('all', '');
  }
});

function renderPool(role, search) {
  const pool = document.getElementById('heroesPoolZone');
  pool.innerHTML = '';

  catalogData.forEach(hero => {
    if (role !== 'all' && !hero.roles.includes(role)) return;
    if (search && !hero.nombre.toLowerCase().includes(search)) return;

    const div = document.createElement('div');
    div.className = 'pool-item';
    div.innerHTML = `<img src="${hero.imagen}" title="${hero.nombre}" crossorigin="anonymous">`;
    
    // Soporte nativo para arrastre de escritorio (Drag and Drop HTML5)
    div.setAttribute('draggable', 'true');
    div.addEventListener('dragstart', (e) => {
      draggingSrc = hero.imagen;
      e.dataTransfer.setData('text/plain', hero.imagen);
    });

    // Soporte táctil móvil avanzado (Touch Events interactivos sin lag)
    div.addEventListener('touchstart', (e) => {
      draggingSrc = hero.imagen;
    }, {passive: true});

    pool.appendChild(div);
  });
}

const mapZone = document.getElementById('mapZone');
const trashBin = document.getElementById('trashBin');

// Gestión de eventos Drag & Drop de escritorio
mapZone.addEventListener('dragover', (e) => { e.preventDefault(); });
mapZone.addEventListener('drop', (e) => {
  e.preventDefault();
  if (!draggingSrc) return;

  const rect = mapZone.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const currentSide = document.querySelector('input[name="sideGroup"]:checked').value;
  spawnNode(draggingSrc, x, y, currentSide);
  draggingSrc = null;
});

function spawnNode(src, x, y, side) {
  const img = document.createElement('img');
  img.src = src;
  img.className = `map-node ${side}`;
  img.style.left = x + 'px';
  img.style.top = y + 'px';
  img.setAttribute('crossorigin', 'anonymous');

  // Lógica de manipulación de puntero de escritorio (Mouse Events)
  img.addEventListener('mousedown', (e) => {
    e.preventDefault();
    activeNode = img;
    img.style.cursor = 'grabbing';
  });

  // Lógica de soporte móvil touch completo para reposicionamiento del nodo en tiempo real
  img.addEventListener('touchstart', (e) => {
    activeNode = img;
  }, {passive: false});

  mapZone.appendChild(img);
}

// Escuchas globales de movimiento de puntero
window.addEventListener('mousemove', (e) => {
  if (!activeNode) return;
  const rect = mapZone.getBoundingClientRect();
  let x = e.clientX - rect.left;
  let y = e.clientY - rect.top;

  // Bloqueo de coordenadas dentro de los límites del lienzo interactivo
  if (x < 0) x = 0; if (x > 540) x = 540;
  if (y < 0) y = 0; if (y > 540) y = 540;

  activeNode.style.left = x + 'px';
  activeNode.style.top = y + 'px';

  // Resaltado dinámico si el puntero pasa sobre la papelera de reciclaje
  const trashRect = trashBin.getBoundingClientRect();
  if (e.clientX >= trashRect.left && e.clientX <= trashRect.right &&
      e.clientY >= trashRect.top && e.clientY <= trashRect.bottom) {
    trashBin.classList.add('drag-over');
  } else {
    trashBin.classList.remove('drag-over');
  }
});

window.addEventListener('mouseup', (e) => {
  if (!activeNode) return;
  
  const trashRect = trashBin.getBoundingClientRect();
  if (e.clientX >= trashRect.left && e.clientX <= trashRect.right &&
      e.clientY >= trashRect.top && e.clientY <= trashRect.bottom) {
    activeNode.remove();
  }

  activeNode.style.cursor = 'grab';
  activeNode = null;
  trashBin.classList.remove('drag-over');
});

// Escuchas globales táctiles para móviles (TouchMove / TouchEnd)
window.addEventListener('touchmove', (e) => {
  if (!activeNode) return;
  const touch = e.touches[0];
  const rect = mapZone.getBoundingClientRect();
  let x = touch.clientX - rect.left;
  let y = touch.clientY - rect.top;

  if (x < 0) x = 0; if (x > 540) x = 540;
  if (y < 0) y = 0; if (y > 540) y = 540;

  activeNode.style.left = x + 'px';
  activeNode.style.top = y + 'px';

  const trashRect = trashBin.getBoundingClientRect();
  if (touch.clientX >= trashRect.left && touch.clientX <= trashRect.right &&
      touch.clientY >= trashRect.top && touch.clientY <= trashRect.bottom) {
    trashBin.classList.add('drag-over');
  } else {
    trashBin.classList.remove('drag-over');
  }
}, {passive: false});

window.addEventListener('touchend', (e) => {
  if (!activeNode) return;
  const touch = e.changedTouches[0];
  const trashRect = trashBin.getBoundingClientRect();
  
  if (touch.clientX >= trashRect.left && touch.clientX <= trashRect.right &&
      touch.clientY >= trashRect.top && touch.clientY <= trashRect.bottom) {
    activeNode.remove();
  }

  activeNode = null;
  trashBin.classList.remove('drag-over');
});

// Soporte alternativo mediante clics directos sobre el mapa táctico
mapZone.addEventListener('click', (e) => {
  if (e.target !== mapZone && e.target.tagName !== 'IMG') return;
  if (e.target.classList.contains('map-node')) return;
  if (draggingSrc) return; 

  const rect = mapZone.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  
  // Permite añadir un nodo genérico de color si se hace click plano sobre el lienzo
  const currentSide = document.querySelector('input[name="sideGroup"]:checked').value;
  const dot = document.createElement('div');
  dot.className = `map-node ${currentSide}`;
  dot.style.left = x + 'px';
  dot.style.top = y + 'px';
  dot.style.backgroundColor = (currentSide === 'azul') ? '#4f6edb' : '#ef4444';

  dot.addEventListener('mousedown', (evt) => {
    evt.preventDefault();
    activeNode = dot;
  });
  
  dot.addEventListener('touchstart', (evt) => {
    activeNode = dot;
  }, {passive: true});

  mapZone.appendChild(dot);
});

// Exportación en HD Crisp de html2canvas (Garantiza capturas nítidas)
document.getElementById('btnExport').addEventListener('click', () => {
  const btn = document.getElementById('btnExport');
  btn.innerText = "⏳ Procesando...";
  btn.disabled = true;

  html2canvas(mapZone, {
    useCORS: true,
    allowTaint: false,
    scale: 2, 
    backgroundColor: null
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'hokstats-planner.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    btn.innerText = "💾 Guardar PNG";
    btn.disabled = false;
  }).catch(err => {
    console.error("Error al exportar:", err);
    alert("Error al procesar la imagen táctica.");
    btn.innerText = "💾 Guardar PNG";
    btn.disabled = false;
  });
});

// Lógica de control de filtros e inputs
let selectedRole = 'all';
let searchKeyword = '';

document.querySelectorAll('.role-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    selectedRole = tab.dataset.role;
    renderPool(selectedRole, searchKeyword);
  });
});

document.getElementById('heroSearch').addEventListener('input', (e) => {
  searchKeyword = e.target.value.toLowerCase().trim();
  renderPool(selectedRole, searchKeyword);
});
</script>

</body>
</html>
