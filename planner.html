<!DOCTYPE html>
<html lang="es" style="scrollbar-gutter: stable;">
<head>
<meta charset="UTF-8">
<title>Map Planner - HoKstats</title>

<style>
/* 📊 IDENTIDAD GLOBAL UNIFICADA Y CONTROL DE LAYOUT SHIFT */
* {
  box-sizing: border-box;
}

body {
  background: #1c1c1f;
  font-family: Arial, sans-serif;
  color: #a0a0b5;
  margin: 0;
  padding: 24px 0;
  user-select: none;
}

/* MARCO MAESTRO */
.container {
  width: 100%;
  max-width: 1160px;
  margin: 0 auto;
  padding: 0 30px;
}

/* BARRA SUPERIOR ESTATICA */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 20px;
  padding: 0 4px;
}

.logo-text {
  font-family: monospace;
  font-size: 22px;
  color: white;
  margin: 0;
  letter-spacing: 1px;
  line-height: 1;
}

.view-tabs {
  display: flex;
  gap: 6px;
}

.view-tab {
  padding: 6px 12px;
  font-size: 12px;
  background: #31313c;
  border: 1px solid #444452;
  cursor: pointer;
  color: #a0a0b5;
  text-decoration: none;
  white-space: nowrap;
  line-height: 1.2;
}

.view-tab.active {
  background: #4f6edb;
  color: white;
  border-color: #4f6edb;
}

/* 📦 CAJA MAESTRA UNIVERSAL */
.main-box {
  background: #31313c;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid #444452;
  width: 100%;
}

.content-padding-zone {
  padding: 40px 30px;
}

/* 🗺️ INTERFAZ DEL PLANNER ORIGINAL CON SUS LÁPICES Y CONTROLES */
.planner-layout {
  display: flex;
  gap: 20px;
}

/* CONTENEDOR DEL MAPA Y LIENZOS */
.map-wrapper-block {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.map-container {
  position: relative;
  width: 540px;
  height: 540px;
  background: #24242b;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid #444452;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.map-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  user-select: none;
  -webkit-user-drag: none;
  position: absolute;
  top: 0;
  left: 0;
  z-index: 1;
}

/* Lienzo de dibujo para los lápices y flechas */
#drawingCanvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 540px;
  height: 540px;
  z-index: 2;
  cursor: crosshair;
}

.map-node {
  position: absolute;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  cursor: grab;
  z-index: 10;
  box-shadow: 0 2px 5px rgba(0,0,0,0.5);
}

.map-node:active {
  cursor: grabbing;
}

.map-node.azul { border: 2px solid #4f6edb; }
.map-node.rojo { border: 2px solid #ef4444; }

.trash-bin {
  position: absolute;
  bottom: 15px;
  right: 15px;
  width: 44px;
  height: 44px;
  background: rgba(28, 28, 31, 0.9);
  border: 1px dashed #ef4444;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  z-index: 15;
  transition: all 0.2s ease;
}

.trash-bin.drag-over {
  background: #ef4444;
  transform: scale(1.1);
}

/* 🎨 BARRA DE HERRAMIENTAS DE DIBUJO ORIGINAL */
.drawing-toolbar {
  background: #24242b;
  border: 1px solid #444452;
  border-radius: 6px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 540px;
}

.tool-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-tool {
  background: #31313c;
  border: 1px solid #444452;
  color: #a0a0b5;
  padding: 6px 10px;
  font-size: 12px;
  border-radius: 4px;
  cursor: pointer;
}

.btn-tool:hover { border-color: #7b7a8e; color: white; }
.btn-tool.active { background: #4f6edb; border-color: #4f6edb; color: white; }

.color-picker-dot {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
}
.color-picker-dot.selected { border-color: white; }

/* CAJÓN / SIDEBAR ORIGINAL INTEGRAL */
.drawer {
  flex: 1;
  background: #24242b;
  border-radius: 6px;
  border: 1px solid #444452;
  padding: 15px;
  display: flex;
  flex-direction: column;
  height: 594px; /* Ajustado perfectamente al alto combinado de mapa + barra de dibujo */
}

.drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.drawer-title {
  color: white;
  font-size: 14px;
  font-weight: bold;
}

.btn-download {
  background: #4f6edb;
  border: none;
  color: white;
  padding: 6px 12px;
  font-size: 11px;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
}
.btn-download:hover { background: #3b55b8; }

.side-selector {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.side-option { flex: 1; }
.side-option input[type="radio"] { display: none; }

.side-label {
  display: block;
  text-align: center;
  padding: 8px;
  background: #31313c;
  border: 1px solid #444452;
  border-radius: 4px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  color: #a0a0b5;
}

.side-option input[type="radio"]:checked + .side-label.blue-side {
  background: rgba(79, 110, 219, 0.15); border-color: #4f6edb; color: #748ffc;
}
.side-option input[type="radio"]:checked + .side-label.red-side {
  background: rgba(239, 68, 68, 0.15); border-color: #ef4444; color: #ff8787;
}

.filter-row {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
  align-items: center;
}

.role-tabs {
  display: flex;
  flex: 1;
  border: 1px solid #444452;
  border-radius: 4px;
  overflow: hidden;
}

.role-tab {
  flex: 1;
  text-align: center;
  padding: 6px 2px;
  background: #31313c;
  font-size: 11px;
  color: #a0a0b5;
  cursor: pointer;
  border: none;
  border-right: 1px solid #444452;
  outline: none;
}
.role-tab:last-child { border-right: none; }
.role-tab.active { background: #4f6edb; color: white; }

.search-field { width: 140px; }
.search-field input {
  width: 100%;
  padding: 6px 10px;
  background: #1c1c1f;
  border: 1px solid #444452;
  border-radius: 4px;
  color: white;
  font-size: 11px;
  outline: none;
}

.heroes-pool {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  overflow-y: auto;
  background: #1c1c1f;
  border: 1px solid #444452;
  border-radius: 4px;
  padding: 10px;
}

.pool-item {
  aspect-ratio: 1;
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid #444452;
  cursor: grab;
  background: #31313c;
}

.pool-item img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}

.heroes-pool::-webkit-scrollbar { width: 4px; }
.heroes-pool::-webkit-scrollbar-thumb { background: #444452; border-radius: 2px; }
</style>
</head>

<body>

<div class="container">

  <div class="top-bar">
    <div class="logo-text">HoKstats</div>
    <div class="view-tabs">
      <a href="index.html" class="view-tab">General</a>
      <a href="stats.html" class="view-tab">Estadísticas</a>
      <a href="counter.html" class="view-tab">Counters</a>
      <a href="planner.html" class="view-tab active">Planner</a>
      <a href="draft.html" class="view-tab">Draft</a>
      <a href="acerca.html" class="view-tab">Acerca de</a>
    </div>
  </div>

  <div class="main-box">
    <div class="content-padding-zone">

      <div class="planner-layout">
        
        <div class="map-wrapper-block">
          <div class="map-container" id="mapZone">
            <img src="https://r2.community.honorofkings.com/content/171569426367809631.JPEG" draggable="false" crossorigin="anonymous">
            <canvas id="drawingCanvas" width="540" height="540"></canvas>
            <div class="trash-bin" id="trashBin">🗑️</div>
          </div>

          <div class="drawing-toolbar">
            <div class="tool-group">
              <button class="btn-tool active" id="toolMove" onclick="setTool('move')">🖐️ Mover</button>
              <button class="btn-tool" id="toolPencil" onclick="setTool('pencil')">✏️ Lápiz</button>
              <button class="btn-tool" id="toolArrow" onclick="setTool('arrow')">🏹 Flecha</button>
              <button class="btn-tool" style="border-color: #ef4444;" onclick="clearCanvas()">🧹 Limpiar</button>
            </div>
            <div class="tool-group">
              <div class="color-picker-dot selected" style="background: #ffffff;" onclick="setColor('#ffffff', this)"></div>
              <div class="color-picker-dot" style="background: #ffcc00;" onclick="setColor('#ffcc00', this)"></div>
              <div class="color-picker-dot" style="background: #ff3b30;" onclick="setColor('#ff3b30', this)"></div>
              <div class="color-picker-dot" style="background: #4cd964;" onclick="setColor('#4cd964', this)"></div>
              <div class="color-picker-dot" style="background: #007aff;" onclick="setColor('#007aff', this)"></div>
            </div>
            <div class="tool-group">
              <select id="lineWidthSelect" class="btn-tool" style="background:#31313c; color:white; border:1px solid #444452;" onchange="setLineWidth(this.value)">
                <option value="3">Fino</option>
                <option value="6" selected>Medio</option>
                <option value="10">Grueso</option>
              </select>
            </div>
          </div>
        </div>

        <div class="drawer">
          <div class="drawer-header">
            <span class="drawer-title">Elementos Tácticos</span>
            <button class="btn-download" id="btnExport">💾 Guardar PNG</button>
          </div>

          <div class="side-selector">
            <div class="side-option">
              <input type="radio" name="sideGroup" id="sideBlue" value="azul" checked>
              <label for="sideBlue" class="side-label blue-side">🔵 Bando Azul</label>
            </div>
            <div class="side-option">
              <input type="radio" name="sideGroup" id="sideRed" value="rojo">
              <label for="sideRed" class="side-label red-side">🔴 Bando Rojo</label>
            </div>
          </div>

          <div class="filter-row">
            <div class="role-tabs">
              <button class="role-tab active" data-role="all">Todo</button>
              <button class="role-tab" data-role="Choque">Choque</button>
              <button class="role-tab" data-role="Cazador">Cazador</button>
              <button class="role-tab" data-role="Medio">Medio</button>
              <button class="role-tab" data-role="Merodeo">Merodeo</button>
              <button class="role-tab" data-role="Farmeo">Farmeo</button>
            </div>
            <div class="search-field">
              <input type="text" id="heroSearch" placeholder="Buscar...">
            </div>
          </div>

          <div class="heroes-pool" id="heroesPoolZone"></div>
        </div>

      </div>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTO4rMY_drrjKMx3KTdjAaSrH6GenxyZ7YzLPT7oiZ_pNYm6EKG-yJPfmbRcZgYGGi2gERA1Gciw-Fy/pub?gid=538223640&single=true&output=csv";

let catalogData = [];
let draggingSrc = null;
let activeNode = null;

// Configuración del canvas de dibujo técnico original
const canvas = document.getElementById('drawingCanvas');
const ctx = canvas.getContext('2d');
let currentTool = 'move'; // move, pencil, arrow
let drawColor = '#ffffff';
let drawWidth = 6;
let isDrawing = false;
let startX = 0, startY = 0;
let drawingHistory = [];

// Carga de base de datos
Papa.parse(CSV_URL, {
  download: true,
  skipEmptyLines: true,
  complete: function(results) {
    const rows = results.data.slice(1);
    rows.forEach(cols => {
      if (!cols[1]) return;
      catalogData.push({
        nombre: cols[1].trim(),
        imagen: cols[3] ? cols[3].trim() : "",
        roles: [cols[5], cols[6], cols[7]].filter(Boolean).map(r => r.trim())
      });
    });
    catalogData.sort((a,b) => a.nombre.localeCompare(b.nombre));
    renderPool('all', '');
  }
});

function renderPool(role, search) {
  const pool = document.getElementById('heroesPoolZone');
  pool.innerHTML = '';

  catalogData.forEach(hero => {
    if (role !== 'all' && !hero.roles.includes(role)) return;
    if (search && !hero.nombre.toLowerCase().includes(search)) return;

    const div = document.createElement('div');
    div.className = 'pool-item';
    div.innerHTML = `<img src="${hero.imagen}" title="${hero.nombre}" crossorigin="anonymous">`;
    
    div.setAttribute('draggable', 'true');
    div.addEventListener('dragstart', (e) => {
      draggingSrc = hero.imagen;
      e.dataTransfer.setData('text/plain', hero.imagen);
    });

    div.addEventListener('touchstart', (e) => {
      draggingSrc = hero.imagen;
    }, {passive: true});

    pool.appendChild(div);
  });
}

const mapZone = document.getElementById('mapZone');
const trashBin = document.getElementById('trashBin');

// Controladores de herramientas de dibujo
function setTool(tool) {
  currentTool = tool;
  document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('active'));
  if(tool === 'move') document.getElementById('toolMove').classList.add('active');
  if(tool === 'pencil') document.getElementById('toolPencil').classList.add('active');
  if(tool === 'arrow') document.getElementById('toolArrow').classList.add('active');
}

function setColor(color, element) {
  drawColor = color;
  document.querySelectorAll('.color-picker-dot').forEach(d => d.classList.remove('selected'));
  element.classList.add('selected');
}

function setLineWidth(width) {
  drawWidth = parseInt(width);
}

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawingHistory = [];
}

// Mecánicas del canvas interactivo (Pencil / Arrow / Canvas drag)
canvas.addEventListener('mousedown', startDrawingAction);
canvas.addEventListener('mousemove', executeDrawingAction);
canvas.addEventListener('mouseup', stopDrawingAction);

canvas.addEventListener('touchstart', (e) => {
  const touch = e.touches[0];
  const mockEvent = { clientX: touch.clientX, clientY: touch.clientY, preventDefault: () => e.preventDefault() };
  startDrawingAction(mockEvent);
}, {passive: false});

canvas.addEventListener('touchmove', (e) => {
  const touch = e.touches[0];
  const mockEvent = { clientX: touch.clientX, clientY: touch.clientY, preventDefault: () => e.preventDefault() };
  executeDrawingAction(mockEvent);
}, {passive: false});

canvas.addEventListener('touchend', stopDrawingAction);

function startDrawingAction(e) {
  if (currentTool === 'move') return;
  e.preventDefault();
  isDrawing = true;
  const rect = canvas.getBoundingClientRect();
  startX = e.clientX - rect.left;
  startY = e.clientY - rect.top;

  ctx.beginPath();
  ctx.moveTo(startX, startY);
  ctx.strokeStyle = drawColor;
  ctx.lineWidth = drawWidth;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (currentTool === 'arrow') {
    window.canvasSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
  }
}

function executeDrawingAction(e) {
  if (!isDrawing || currentTool === 'move') return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const currentX = e.clientX - rect.left;
  const currentY = e.clientY - rect.top;

  if (currentTool === 'pencil') {
    ctx.lineTo(currentX, currentY);
    ctx.stroke();
  } else if (currentTool === 'arrow') {
    ctx.putImageData(window.canvasSnapshot, 0, 0);
    drawVectorArrow(startX, startY, currentX, currentY);
  }
}

function stopDrawingAction() {
  isDrawing = false;
  ctx.beginPath();
}

function drawVectorArrow(fromx, fromy, tox, toy) {
  const headlen = drawWidth * 2.5; 
  const dx = tox - fromx;
  const dy = toy - fromy;
  const angle = Math.atan2(dy, dx);

  ctx.beginPath();
  ctx.moveTo(fromx, fromy);
  ctx.lineTo(tox, toy);
  ctx.strokeStyle = drawColor;
  ctx.lineWidth = drawWidth;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(tox, toy);
  ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
  ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
  ctx.closePath();
  ctx.fillStyle = drawColor;
  ctx.fill();
}

// Drag & Drop elemental de personajes
mapZone.addEventListener('dragover', (e) => { e.preventDefault(); });
mapZone.addEventListener('drop', (e) => {
  e.preventDefault();
  if (!draggingSrc) return;

  const rect = mapZone.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const currentSide = document.querySelector('input[name="sideGroup"]:checked').value;
  spawnNode(draggingSrc, x, y, currentSide);
  draggingSrc = null;
});

function spawnNode(src, x, y, side) {
  const img = document.createElement('img');
  img.src = src;
  img.className = `map-node ${side}`;
  img.style.left = x + 'px';
  img.style.top = y + 'px';
  img.setAttribute('crossorigin', 'anonymous');

  img.addEventListener('mousedown', (e) => {
    if (currentTool !== 'move') return;
    e.preventDefault();
    activeNode = img;
  });

  img.addEventListener('touchstart', (e) => {
    if (currentTool !== 'move') return;
    activeNode = img;
  }, {passive: true});

  mapZone.appendChild(img);
}

// Control global de arrastre de fichas (Mouse y Touch)
window.addEventListener('mousemove', (e) => {
  if (!activeNode) return;
  const rect = mapZone.getBoundingClientRect();
  let x = e.clientX - rect.left;
  let y = e.clientY - rect.top;

  if (x < 0) x = 0; if (x > 540) x = 540;
  if (y < 0) y = 0; if (y > 540) y = 540;

  activeNode.style.left = x + 'px';
  activeNode.style.top = y + 'px';

  const trashRect = trashBin.getBoundingClientRect();
  if (e.clientX >= trashRect.left && e.clientX <= trashRect.right &&
      e.clientY >= trashRect.top && e.clientY <= trashRect.bottom) {
    trashBin.classList.add('drag-over');
  } else {
    trashBin.classList.remove('drag-over');
  }
});

window.addEventListener('mouseup', (e) => {
  if (!activeNode) return;
  const trashRect = trashBin.getBoundingClientRect();
  if (e.clientX >= trashRect.left && e.clientX <= trashRect.right &&
      e.clientY >= trashRect.top && e.clientY <= trashRect.bottom) {
    activeNode.remove();
  }
  activeNode = null;
  trashBin.classList.remove('drag-over');
});

window.addEventListener('touchmove', (e) => {
  if (!activeNode) return;
  const touch = e.touches[0];
  const rect = mapZone.getBoundingClientRect();
  let x = touch.clientX - rect.left;
  let y = touch.clientY - rect.top;

  if (x < 0) x = 0; if (x > 540) x = 540;
  if (y < 0) y = 0; if (y > 540) y = 540;

  activeNode.style.left = x + 'px';
  activeNode.style.top = y + 'px';

  const trashRect = trashBin.getBoundingClientRect();
  if (touch.clientX >= trashRect.left && touch.clientX <= trashRect.right &&
      touch.clientY >= trashRect.top && touch.clientY <= trashRect.bottom) {
    trashBin.classList.add('drag-over');
  } else {
    trashBin.classList.remove('drag-over');
  }
});

window.addEventListener('touchend', (e) => {
  if (!activeNode) return;
  const touch = e.changedTouches[0];
  const trashRect = trashBin.getBoundingClientRect();
  if (touch.clientX >= trashRect.left && touch.clientX <= trashRect.right &&
      touch.clientY >= trashRect.top && touch.clientY <= trashRect.bottom) {
    activeNode.remove();
  }
  activeNode = null;
  trashBin.classList.remove('drag-over');
});

// Soporte alternativo para clics planos e hitmarks
mapZone.addEventListener('click', (e) => {
  if (currentTool !== 'move') return;
  if (e.target !== mapZone && e.target !== canvas) return;
  if (draggingSrc) return;

  const rect = mapZone.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  
  const currentSide = document.querySelector('input[name="sideGroup"]:checked').value;
  const dot = document.createElement('div');
  dot.className = `map-node ${currentSide}`;
  dot.style.left = x + 'px';
  dot.style.top = y + 'px';
  dot.style.backgroundColor = (currentSide === 'azul') ? '#4f6edb' : '#ef4444';

  dot.addEventListener('mousedown', (evt) => {
    if (currentTool !== 'move') return;
    evt.preventDefault();
    activeNode = dot;
  });
  
  dot.addEventListener('touchstart', (evt) => {
    if (currentTool !== 'move') return;
    activeNode = dot;
  }, {passive: true});

  mapZone.appendChild(dot);
});

// Exportación mediante html2canvas
document.getElementById('btnExport').addEventListener('click', () => {
  const btn = document.getElementById('btnExport');
  btn.innerText = "⏳ Procesando...";
  btn.disabled = true;

  html2canvas(mapZone, {
    useCORS: true,
    allowTaint: false,
    scale: 2, 
    backgroundColor: null
  }).then(canvasGenerated => {
    const link = document.createElement('a');
    link.download = 'hokstats-planner.png';
    link.href = canvasGenerated.toDataURL('image/png');
    link.click();
    
    btn.innerText = "💾 Guardar PNG";
    btn.disabled = false;
  }).catch(err => {
    console.error(err);
    btn.innerText = "💾 Guardar PNG";
    btn.disabled = false;
  });
});

// Control de Filtros
let selectedRole = 'all';
let searchKeyword = '';

document.querySelectorAll('.role-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    selectedRole = tab.dataset.role;
    renderPool(selectedRole, searchKeyword);
  });
});

document.getElementById('heroSearch').addEventListener('input', (e) => {
  searchKeyword = e.target.value.toLowerCase().trim();
  renderPool(selectedRole, searchKeyword);
});
</script>
